<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spectra Workspace</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: fixed left rail (marca + navegação) beside a working canvas; o CRM é um funil horizontal que atravessa as cores do espectro, da esquerda para a direita. */
:root{
  --bg:#F7F6FB; --surface:#FFFFFF; --surface-2:#EEEDF4; --ink:#17151F; --muted:#686577;
  --line:#E4E1EE; --line-2:#D4D0E2; --accent:#7C5CE6; --on-accent:#FFFFFF;
  --danger:#D23A4C; --ok:#1B9A5A; --warn:#C27F00;
  --shadow:0 1px 2px rgba(23,21,31,.06),0 6px 20px -8px rgba(23,21,31,.14);
  --shadow-lg:0 24px 60px -20px rgba(23,21,31,.35);
  --prism:linear-gradient(90deg,#FF4D6D 0%,#FF9F1C 20%,#FFD23F 38%,#2EC4B6 58%,#3A86FF 78%,#8338EC 100%);
  --f-display:"Plus Jakarta Sans","Figtree",system-ui,sans-serif;
  --rail:#14111C; --rail-ink:#EEEAF7; --rail-muted:#8E89A3; --rail-line:#272336; --rail-accent:#A48FFF;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:8px; --r-m:12px; --r-l:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100F15; --surface:#1A1922; --surface-2:#22212C; --ink:#F1F0F6; --muted:#9E9BAE;
  --line:#2B2937; --line-2:#3A3847; --accent:#A48FFF; --on-accent:#120F24;
  --danger:#FF6B7B; --ok:#3CCB83; --warn:#F2B53A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100F15; --surface:#1A1922; --surface-2:#22212C; --ink:#F1F0F6; --muted:#9E9BAE;
  --line:#2B2937; --line-2:#3A3847; --accent:#A48FFF; --on-accent:#120F24;
  --danger:#FF6B7B; --ok:#3CCB83; --warn:#F2B53A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 16px 18px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:10px;padding:4px 8px 0}
.brand-row{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;flex:none;display:grid;place-items:center}
.mark svg{width:100%;height:100%;fill:var(--ink)}
.mark img{width:100%;height:100%;object-fit:contain}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.slogan{font-size:11.5px;letter-spacing:.04em;color:var(--muted);line-height:1.3}
.prism{height:3px;border-radius:3px;background:var(--prism)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a .soon{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.nav a[aria-current="page"] .soon{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.me img{width:32px;height:32px;border-radius:50%}
.me b{display:block;font-size:13.5px}
.me span{font-size:12px;color:var(--muted)}
.ghost-btn{display:flex;align-items:center;gap:9px;border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left}
.ghost-btn:hover{background:var(--surface-2);color:var(--ink)}
.ghost-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}

main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.page-head h1{font-size:clamp(30px,4vw,42px);font-weight:800;line-height:1}
.page-head p{margin:8px 0 0;color:var(--muted)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--accent))}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.win{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.small{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:13.5px;margin-bottom:18px}
.banner b{color:var(--ink)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
button.kpi:hover{border-color:var(--line-2)}
.kpi .k-label{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .k-dot{width:8px;height:8px;border-radius:50%}
.kpi .k-val{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.02em}
.kpi .k-sub{font-size:12.5px;color:var(--muted)}
.kpi.alert .k-val{color:var(--danger)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;height:34px;padding:0 13px;border-radius:9px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .count{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--danger);color:#fff}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 36px}
.search svg{position:absolute;left:12px;top:12px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.select{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%}

/* ---------- Funil ---------- */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:2px 4px 14px;scroll-snap-type:x proximity}
.board{display:flex;gap:12px;align-items:flex-start;min-width:min-content}
.col{width:262px;flex:none;background:var(--surface-2);border-radius:var(--r-l);padding:10px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;border:2px solid transparent;transition:border-color .15s,background .15s}
.col.drop{border-color:var(--hue);background:color-mix(in srgb,var(--hue) 10%,var(--surface-2))}
.col-head{display:flex;flex-direction:column;gap:6px;padding:4px 6px 6px}
.col-title{display:flex;align-items:center;gap:8px;font-weight:700}
.col-title .dot{width:10px;height:10px;border-radius:50%;background:var(--hue);box-shadow:0 0 0 3px color-mix(in srgb,var(--hue) 22%,transparent)}
.col-title .c{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);padding:1px 8px;border-radius:99px}
.col-sum{font-size:12.5px;color:var(--muted)}
.col-bar{height:3px;border-radius:3px;background:var(--hue);opacity:.85}
.cards{display:flex;flex-direction:column;gap:8px;min-height:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 1px rgba(0,0,0,.02)}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card.dragging{opacity:.45}
.card .c-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card .c-name{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.card .c-handle{font-size:12.5px;color:var(--muted)}
.card .c-val{font-family:var(--f-display);font-weight:700;font-size:16px}
.card .c-val small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.svc{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:color-mix(in srgb,var(--accent) 75%,var(--ink))}
.chip.late{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.chip.today{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.chip.date{background:transparent;padding-left:0;color:var(--muted)}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.col-add{border:1.5px dashed var(--line-2);background:transparent;border-radius:12px;padding:9px;color:var(--muted);font-weight:600;font-size:13.5px}
.col-add:hover{border-color:var(--hue);color:var(--ink)}
.col-empty{font-size:13px;color:var(--muted);padding:14px 8px;text-align:center;border:1.5px dashed var(--line-2);border-radius:12px}
.stage-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--hue) 15%,var(--surface));color:color-mix(in srgb,var(--hue) 72%,var(--ink));white-space:nowrap}
.stage-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hue)}

/* ---------- Lista ---------- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td .t-name{font-weight:700}
td .t-sub{font-size:12.5px;color:var(--muted)}

/* ---------- Próximos contatos ---------- */
.agenda{display:grid;gap:18px}
.agenda h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agenda h3 .n{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:1px 8px;border-radius:99px}
.agenda h3.late{color:var(--danger)}
.ag-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.ag-row{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.ag-row:last-child{border-bottom:0}
.ag-row .who{min-width:0}
.ag-row .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-row .who span{font-size:12.5px;color:var(--muted)}
.ag-row .note{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ag-row .acts{display:flex;gap:6px}

/* ---------- Empty / placeholder ---------- */
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-l);padding:36px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.soon-page{max-width:760px}
.soon-page .prism{margin:18px 0 22px;width:120px}
.soon-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px}
.soon-list div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
.soon-list b{display:block;margin-bottom:3px}
.soon-list span{color:var(--muted);font-size:13px}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#0b0a10 52%,transparent);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden}
.modal.sm{width:min(460px,100%)}
.m-head,.m-tabs,.m-foot{flex:none}
.m-head{padding:20px 22px 0;display:flex;align-items:flex-start;gap:12px}
.m-head h2{font-size:22px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.m-head .sub{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--f-body);font-weight:500;letter-spacing:0}
.m-tabs{margin:16px 22px 0;display:flex;padding:3px;background:var(--surface-2);border-radius:12px;gap:2px;overflow-x:auto}
.m-tabs button{flex:1;border:0;background:none;height:36px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap;padding:0 10px}
.m-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.m-body{padding:18px 22px;overflow-y:auto;min-height:0;flex:1}
.m-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m-foot .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.flabel{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.inp{height:42px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.err{border-color:var(--danger)}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.toggle input{width:34px;height:20px;appearance:none;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(14px)}
.with-btn{display:flex;gap:8px}
.with-btn .inp{flex:1}
.note-box{padding:11px 14px;border-radius:12px;background:var(--surface-2);font-size:13.5px;color:var(--muted);margin-bottom:16px}
.note-box b{color:var(--ink)}
.contract{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.contract-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);border:0;width:100%;text-align:left}
.contract-h b{font-size:15px}
.contract-h .tot{margin-left:auto;font-size:13px;color:var(--muted)}
.contract-h svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
.contract.open .contract-h svg{transform:rotate(180deg)}
.contract-b{padding:14px}
.status-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.st-Ativo{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.st-Pausado{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.st-Encerrado{background:var(--surface);color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.calc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 12px;border-radius:11px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));font-size:13.5px}
.calc b{font-variant-numeric:tabular-nums}
.add-contract{width:100%;height:44px;border:1.5px dashed var(--line-2);border-radius:13px;background:none;font-weight:600;color:var(--muted)}
.add-contract:hover{border-color:var(--ink);color:var(--ink)}
.confirm-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.hist{display:flex;flex-direction:column;gap:0}
.hist-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist-item:last-child{border-bottom:0}
.hist-item img,.av{width:28px;height:28px;border-radius:50%}
.av{display:grid;place-items:center;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted)}
.hist-item p{margin:0;font-size:14px;overflow-wrap:anywhere}
.hist-item time{font-size:12px;color:var(--muted)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);box-shadow:var(--shadow-lg);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .m-body{padding-top:8px}
.stage-edit{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px;align-items:center;margin-bottom:8px}
.swatch-btn{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);background:var(--hue)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.logo-prev{width:88px;height:88px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;padding:14px}
.logo-prev svg{width:100%;height:100%;fill:var(--ink)}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.win-art{height:6px;border-radius:6px;background:var(--prism);margin-top:14px}

.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow-lg);z-index:80;max-width:calc(100% - 32px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.skeleton{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Clientes: lista ---------- */
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.ccard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:visible;display:flex;flex-direction:column;cursor:pointer;text-align:left;min-width:0}
.ccard:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
.ccard .cover{height:88px;border-radius:19px 19px 0 0;background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 72%,#fff))}
.ccard.excl{opacity:.6}
.ph{width:68px;height:68px;border-radius:18px;background:var(--surface);border:4px solid var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .ini{font-family:var(--f-display);font-weight:800;font-size:24px;color:color-mix(in srgb,var(--cc) 80%,var(--ink))}
.ccard .ph{margin:-38px 0 0 18px}
.cbody{padding:10px 18px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cname{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cname h3{font-size:19px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:color-mix(in srgb,var(--accent) 80%,var(--ink))}
.badge.Pausado{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.badge.Encerrado,.badge.Excluído{background:var(--surface-2);color:var(--muted)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.cnt{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:10px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--sc) 11%,var(--surface));color:color-mix(in srgb,var(--sc) 78%,var(--ink));font-variant-numeric:tabular-nums}
.cnt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc);flex:none}
.cc-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.ccard:hover .cc-actions,.ccard:focus-within .cc-actions{opacity:1}
@media (hover:none){.cc-actions{opacity:1}}
.cc-actions>button,.cc-actions>label{width:32px;height:32px;border-radius:9px;border:0;background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.cc-actions svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.palette{position:absolute;top:48px;right:10px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:12px;display:flex;flex-direction:column;gap:10px;width:190px;cursor:default}
.palette .swatches button{width:28px;height:28px}
.palette .auto{border:0;background:none;text-align:left;font-size:13px;color:var(--muted);padding:4px 0;border-top:1px solid var(--line);padding-top:8px}

/* ---------- Espaço do cliente ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;text-decoration:none;font-size:13.5px;margin-bottom:12px}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.cs-head{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px}
.cs-head .band{height:8px;background:var(--cc)}
.cs-row{display:flex;align-items:center;gap:16px;padding:16px 20px;flex-wrap:wrap}
.cs-row .ph{box-shadow:none;border:1px solid var(--line);width:64px;height:64px}
.cs-title{flex:1;min-width:0}
.cs-title h1{font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.cs-title .chips{margin-top:6px}
.cs-acts{display:flex;gap:8px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:44px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column;min-width:170px}
.menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600;display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.ctabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
.ctabs button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:9px 14px;border-radius:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.ctabs button:hover{background:var(--surface);color:var(--ink)}
.ctabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ctabs svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Calendário ---------- */
.monthbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.monthbar .mname{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:150px;text-align:center}
.monthbar .stats{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.monthbar .stats b{font-variant-numeric:tabular-nums;color:var(--sc);margin-right:4px}
.weeks-wrap{overflow-x:auto;padding-bottom:10px}
.weeks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px}
.week{display:flex;flex-direction:column;gap:8px;min-width:0}
.week-h{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.week-h b{display:block;font-family:var(--f-display)}
.week-h span{font-size:12.5px;color:var(--muted)}
.pcard{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.pcard:hover{box-shadow:var(--shadow)}
.pcard .pt{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.pcard .pt b{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.pcard .pt time{font-size:12px;color:var(--muted);white-space:nowrap}
.st-dot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--sc) 78%,var(--ink))}
.st-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.comm{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,#8B5CF6 12%,var(--surface));color:color-mix(in srgb,#8B5CF6 75%,var(--ink));border-left:3px solid #8B5CF6}
.comm small{font-weight:500;opacity:.8;margin-left:4px}
.month-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--line)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;min-width:700px}
.month .dow{background:var(--surface-2);padding:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.day{background:var(--surface);min-height:116px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.day.out{background:var(--surface-2);cursor:default}
.day.out .dn{opacity:.4}
.day .dn{font-size:12.5px;font-weight:700;align-self:flex-start;padding:1px 6px;border-radius:99px}
.day.today .dn{background:var(--ink);color:var(--bg)}
.mini{font-size:12px;font-weight:600;padding:3px 7px;border-radius:7px;background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:color-mix(in srgb,var(--sc) 70%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;width:100%}
.mini.c{background:transparent;color:#8B5CF6;padding:0 2px;font-weight:600}
.more{font-size:11.5px;color:var(--muted);padding-left:4px}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;max-width:600px;margin-inline:auto;border-radius:12px;overflow:hidden}
.ftile{aspect-ratio:4/5;position:relative;border:0;padding:0;background:color-mix(in srgb,var(--cc) 30%,var(--surface-2));cursor:pointer;overflow:hidden;display:flex;align-items:flex-end}
.ftile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftile span{position:relative;font-size:12px;font-weight:700;padding:8px;text-align:left;color:var(--ink);line-height:1.2}
.ftile i{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--sc);border:2px solid #fff}

/* ---------- Editor de post ---------- */
.editor{width:min(1260px,100%);height:100%;max-height:100%;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ed-top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.ed-top .who{display:flex;align-items:center;gap:8px;font-weight:700;padding-right:10px;border-right:1px solid var(--line)}
.ed-top .who .ph{width:30px;height:30px;border-radius:9px;border:0;box-shadow:none}
.ed-top .who .ph .ini{font-size:13px}
.ed-title{flex:1 1 200px;min-width:0;border:0;background:none;font-family:var(--f-display);font-weight:700;font-size:20px;padding:4px 6px;border-radius:8px}
.ed-title:hover,.ed-title:focus{background:var(--surface-2);outline:none}
.ed-top .num{font-size:12.5px;color:var(--muted)}
.ed-when{display:flex;gap:6px}
.ed-when .inp{height:36px;width:auto}
.ed-save{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.ed-main{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);overflow:hidden}
.ed-prev{padding:18px;border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.phone{border-radius:24px;background:var(--surface);overflow:hidden;border:6px solid var(--ink);box-shadow:var(--shadow)}
.phone .ph-media{aspect-ratio:var(--ar,4/5);background:color-mix(in srgb,var(--cc) 22%,var(--surface-2));display:grid;place-items:center;position:relative;overflow:hidden}
.phone .ph-media img,.phone .ph-media video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.phone .ph-media .ph-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px}
.phone .ph-cap{padding:10px 12px;font-size:12.5px;line-height:1.4;max-height:150px;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.phone .ph-cap b{margin-right:5px}
.ed-meta{display:flex;flex-direction:column;gap:6px;font-size:13px}
.ed-meta .row{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.ed-meta .row b{color:var(--ink);text-align:right}
.ed-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.step{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;min-width:0}
.step[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.step .sp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:color-mix(in srgb,var(--sc) 78%,var(--ink));white-space:nowrap}
.step-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step-head h3{font-size:18px;flex:1}
.stpick{display:flex;gap:4px;flex-wrap:wrap}
.stpick button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.stpick button[aria-pressed="true"]{background:var(--sc);border-color:var(--sc);color:#fff}
.dir-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.media-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.media-item{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/5;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:6px}
.media-item img,.media-item video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media-item .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:0;background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center}
.media-item .rm svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:2}
.media-item .ord{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6}
.ed-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;flex:none}
.ed-foot .mid{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-inline:auto;justify-content:center}
.pillsel{height:34px;border-radius:99px;border:1px solid var(--line-2);padding:0 12px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--sc) 12%,var(--surface));color:color-mix(in srgb,var(--sc) 80%,var(--ink))}
.ed-foot .icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.side{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;z-index:4}
.side .m-body{display:flex;flex-direction:column;gap:12px}
.ai-btn{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--prism) border-box;border:1.5px solid transparent}
.ai-btn:hover{border-color:transparent}
.ai-note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:flex-start}
.msg img,.msg .av{width:28px;height:28px;border-radius:50%}
.msg .bub{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;justify-self:start;max-width:100%}
.msg.me{grid-template-columns:minmax(0,1fr) 28px}
.msg.me .bub{background:var(--ink);color:var(--bg);border-radius:14px 4px 14px 14px;justify-self:end;grid-column:1;grid-row:1}
.msg.me img,.msg.me .av{grid-column:2;grid-row:1}
.msg .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.msg.me .meta{text-align:right}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;height:44px;max-height:160px}
.chat-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;max-width:860px}
.chat-panel .chat{padding:18px;max-height:56vh;overflow-y:auto}
.chat-panel .composer{padding:12px;border-top:1px solid var(--line)}

/* ---------- Central criativa ---------- */
.cc-hero{text-align:center;padding:14px 0 6px;display:flex;flex-direction:column;align-items:center;gap:16px}
.cc-hero h2{font-size:clamp(26px,4vw,40px);font-weight:800;background:var(--prism);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.cc-hero .search{width:min(640px,100%);flex:none}
.types{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;margin-bottom:22px}
.type{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:12.5px;font-weight:600;color:var(--muted);width:76px}
.type i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,var(--surface));color:var(--tc);transition:transform .15s}
.type:hover i{transform:translateY(-2px)}
.type:hover{color:var(--ink)}
.type svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h3{font-size:18px;flex:1}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.item{padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;min-width:0}
.item:hover{box-shadow:var(--shadow)}
.item .thumb{aspect-ratio:16/10;background:color-mix(in srgb,var(--tc) 14%,var(--surface-2));display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:2px;overflow:hidden}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .thumb.txt{display:flex;padding:14px;font-size:13.5px;color:var(--ink);overflow:hidden;line-height:1.4;align-items:flex-start}
.item .ib{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.item .ib b{overflow-wrap:anywhere}
.item .ib .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tchip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--tc) 15%,var(--surface));color:color-mix(in srgb,var(--tc) 78%,var(--ink));align-self:flex-start}

/* ---------- Arquivos ---------- */
.files-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.files-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.crumbs{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font-weight:600}
.crumbs button{border:0;background:none;color:var(--muted);font-weight:600;padding:4px 6px;border-radius:7px}
.crumbs button:hover{color:var(--ink);background:var(--surface-2)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;margin-bottom:14px}
.folder{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--surface);font-weight:600;text-align:left;min-width:0}
.folder:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.folder svg{width:22px;height:22px;stroke:#D99A00;fill:color-mix(in srgb,#D99A00 22%,transparent);stroke-width:1.6;flex:none}
.folder span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder small{color:var(--muted);font-weight:600}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);min-width:0}
.file .fthumb{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.05em}
.file .fthumb img{width:100%;height:100%;object-fit:cover}
.file .fi{padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.file .fi b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fi span{font-size:11.5px;color:var(--muted)}
.file .fa{display:flex;gap:4px;padding:0 8px 8px}
.file .fa .icon-btn{width:30px;height:30px}

/* ---------- Briefing ---------- */
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:18px}
.panel .lead{margin:0;color:var(--muted);font-size:13.5px}
.qsec{display:flex;flex-direction:column;gap:6px}
.qsec h4{margin:6px 0 0;font-family:var(--f-display);font-size:15px}
.qsec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.dirs{display:grid;grid-template-columns:1fr;gap:10px}
.dirs div{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.dirs b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.textarea-xl{min-height:320px!important}

/* ---------- Redes ---------- */
.nets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.net{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;min-width:0}
.net i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc);font-style:normal;font-weight:800;flex:none}
.net div{flex:1;min-width:0}
.net b{display:block}
.net span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Portal ---------- */
.portal{width:min(980px,100%);height:100%;background:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.portal-top{background:var(--surface);padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.portal-top .ph{width:48px;height:48px;box-shadow:none;border:1px solid var(--line)}
.portal-body{flex:1;overflow-y:auto;padding:20px}
.pv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.pv .pvm{aspect-ratio:4/5;background:color-mix(in srgb,var(--cc) 25%,var(--surface-2));position:relative}
.pv .pvm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv .pvb{padding:10px 12px;display:flex;flex-direction:column;gap:6px}

@media (max-width:900px){.ed-main{grid-template-columns:minmax(0,1fr)}.ed-prev{display:none}.brief{grid-template-columns:minmax(0,1fr)}.steps{display:flex;overflow-x:auto}.step{flex:0 0 112px}.dir-grid{grid-template-columns:minmax(0,1fr)}.ed-top .who{display:none}}
@media (max-width:560px){.ed-foot .mid{margin:0}.monthbar .stats{margin-left:0}.weeks{grid-auto-columns:82vw}.ed-title{font-size:17px}}

/* ---------- Identidade Spectra (menu escuro) ---------- */
.rail{background:var(--rail);color:var(--rail-ink);border-right:0;padding-top:26px}
.rail .mark svg{fill:#fff} .rail .mark img{filter:brightness(0) invert(1)}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.22em;line-height:1}
.wordmark sup{font-size:9px;letter-spacing:0;margin-left:1px;vertical-align:top}
.wm-sub{font-size:10px;letter-spacing:.55em;color:var(--rail-muted);margin-top:6px}
.status-pill{display:flex;align-items:center;gap:9px;border:1px solid var(--rail-line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--rail-ink)}
.status-pill i{width:7px;height:7px;border-radius:50%;background:#3CCB83;box-shadow:0 0 0 3px rgba(60,203,131,.18)}
.nav-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rail-muted);padding:0 10px;margin-bottom:-12px}
.rail .nav a{color:var(--rail-muted);white-space:nowrap}
.rail .nav a .soon{font-size:9.5px;padding:2px 6px}
.rail .nav a:hover{background:rgba(255,255,255,.06);color:var(--rail-ink)}
.rail .nav a[aria-current="page"]{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.rail .nav a[aria-current="page"] svg{color:var(--rail-accent)}
.rail .nav a .soon,.rail .nav a[aria-current="page"] .soon{background:rgba(255,255,255,.07);color:var(--rail-muted)}
.slogan-card{border:1px solid var(--rail-line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.35;color:var(--rail-ink)}
.slogan-card svg{width:22px;height:22px;stroke:var(--rail-accent);fill:none;stroke-width:1.6}
.rail .ghost-btn{color:var(--rail-muted)} .rail .ghost-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.rail .me{border-top:1px solid var(--rail-line);border-radius:0;padding:12px 8px 0}
.rail .me span{color:var(--rail-muted)} .rail .me .av{background:#2A2537;color:#CFC6F5}
.badge-n{margin-left:auto;background:var(--rail-accent);color:#140F24;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.page-head h1::after,.cs-title h1::after,.dot-title::after{content:".";color:var(--accent)}
.eyebrow{letter-spacing:.2em}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px;cursor:pointer}
.linkish.danger{color:var(--danger)}
.shield{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);flex:none}
.shield svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
#auth{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--rail)}
.auth-card{width:min(420px,100%);background:var(--surface);border-radius:24px;padding:30px;box-shadow:var(--shadow-lg)}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand .mark{width:38px;height:38px;display:grid}
.auth-brand .mark svg{fill:var(--ink)}
.wm{font-family:var(--f-display);font-weight:800;letter-spacing:.22em;font-size:20px}
.wm sup{font-size:9px;letter-spacing:0}
.auth-brand .wm-sub{color:var(--muted)}
.auth-msg{background:var(--surface-2);padding:10px 12px;border-radius:10px;font-size:14px;margin:14px 0 0}
.auth-links{display:flex;justify-content:space-between;gap:8px}
.auth-slogan{margin:24px 0 0;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:860px){.rail .status-pill,.rail .nav-label,.rail .slogan-card,.rail .wm-sub{display:none}.rail{padding-top:12px}.rail .me{border:0;padding:0}.wordmark{font-size:17px}}
/* ---------- Responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px 14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--rail)}
  .brand{padding:0;gap:4px;flex:1}
  .brand .slogan,.brand .prism{display:none}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%;gap:4px;padding-bottom:2px}
  .nav a{white-space:nowrap;padding:7px 11px}
  .nav a .soon{display:none}
  .rail-foot{margin:0;flex-direction:row;align-items:center}
  .me div{display:none}
  .ghost-btn span{display:none}
  main{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ag-row{grid-template-columns:minmax(0,1fr) auto}

  .ag-row .acts{grid-column:1/-1}
}
@media (max-width:560px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kpi .k-val{font-size:26px}
  .col{width:84vw}
  .m-head,.m-body,.m-foot{padding-left:16px;padding-right:16px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
"use strict";
/* ================= Supabase: dados, arquivos, IA e equipe ================= */
const SUPA_URL = "https://lqlnsbnafbccyesdaqhj.supabase.co";
const SUPA_KEY = "sb_publishable_O3tJ8MAfoUlyStIU6YvV9A_44Kq3qI3";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const BLOB = id => SUPA_URL + "/storage/v1/object/public/midias/" + encodeURIComponent(id || "");
const DOC_TABLES = new Set(["oportunidades","clientes","posts","post_conversa","criativo","arquivos","mensagens","briefings","config","atividades"]);
const HAS_CLIENTE = new Set(["posts","criativo","arquivos","mensagens"]);
const META = { fromCache:false, hasPendingWrites:false };
const mapErr = e => {
  const msg = (e && (e.message || e.msg)) || String(e);
  if (e && (e.code === "42501" || /row-level security|permission denied|JWT/i.test(msg))) return { code:"invalid_argument", message:msg };
  if (e && e.code === "P0002") return { code:"invalid_argument", message:msg };
  return { code:"unavailable", message:msg };
};
function colInfo(path){
  const s = path.split("/");
  if (s.length === 1 && DOC_TABLES.has(s[0])) return { table:s[0], path };
  if (s.length === 3 && s[0] === "posts" && s[2] === "conversa") return { table:"post_conversa", parent:s[1], path };
  throw new TypeError("Caminho não suportado: " + path);
}
const snapRow = r => ({ id:r.id, exists:true, data:()=>r.data, metadata:META });
function makeQuery(info, filters, order, lim){
  const build = () => {
    let q = sb.from(info.table).select("id,data");
    if (info.parent) q = q.eq("post_id", info.parent);
    filters.forEach(([f,op,v]) => { if (op !== "==") throw new TypeError("Filtro não suportado: " + op); q = q.eq("data->>" + f, String(v)); });
    if (order) q = q.order("data->>" + order[0], { ascending: order[1] !== "desc" });
    q = q.limit(lim || 5000);
    return q;
  };
  const run = async () => { const { data, error } = await build(); if (error) throw mapErr(error);
    const docs = (data || []).map(snapRow); return { docs, size:docs.length, empty:!docs.length, docChanges:()=>[], metadata:META }; };
  const cf = filters.find(([f]) => f === "clienteId");
  const rtFilter = info.parent ? "post_id=eq." + info.parent : (cf && HAS_CLIENTE.has(info.table) ? "cliente_id=eq." + cf[2] : null);
  return {
    path: info.path,
    where: (f,o,v) => makeQuery(info, [...filters,[f,o,v]], order, lim),
    orderBy: (f,d) => makeQuery(info, filters, [f, d || "asc"], lim),
    limit: n => makeQuery(info, filters, order, n),
    get: run,
    onSnapshot: (next, err) => liveSub(info.table, rtFilter, run, next, err),
    doc: id => docRef(info, id || uid()),
    add: async d => { const r = docRef(info, uid()); await r.set(d); return r; }
  };
}
function liveSub(table, filter, run, next, err){
  let alive = true, timer = null, seq = 0;
  const fire = async () => { const my = ++seq; try { const s = await run(); if (alive && my === seq) next(s); } catch(e){ if (alive && err) err(e); } };
  fire();
  const opts = { event:"*", schema:"public", table }; if (filter) opts.filter = filter;
  const ch = sb.channel("rt-" + uid()).on("postgres_changes", opts, () => { clearTimeout(timer); timer = setTimeout(fire, 120); }).subscribe();
  return () => { alive = false; clearTimeout(timer); sb.removeChannel(ch); };
}
function docRef(info, id){
  const t = info.table, path = info.path + "/" + id;
  const get = async () => { const { data, error } = await sb.from(t).select("id,data").eq("id", id).maybeSingle(); if (error) throw mapErr(error);
    return data ? snapRow(data) : { id, exists:false, data:()=>undefined, metadata:META }; };
  return {
    id, path, get,
    set: async d => { const row = { id, data: JSON.parse(JSON.stringify(d)), atualizado_em: new Date().toISOString() }; if (info.parent) row.post_id = info.parent;
      const { error } = await sb.from(t).upsert(row); if (error) throw mapErr(error); },
    update: async d => { const { error } = await sb.rpc("merge_doc", { p_table:t, p_id:id, p_patch: JSON.parse(JSON.stringify(d)) }); if (error) throw mapErr(error); },
    delete: async () => { const { error } = await sb.from(t).delete().eq("id", id); if (error) throw mapErr(error); },
    onSnapshot: (next, err) => liveSub(t, "id=eq." + id, get, next, err),
    collection: sub => makeQuery(colInfo(path + "/" + sub), [], null, null)
  };
}
const DB = {
  collection: p => makeQuery(colInfo(p), [], null, null),
  doc: p => { const s = p.split("/"); return docRef(colInfo(s.slice(0,-1).join("/")), s[s.length-1]); }
};

/* Arquivos no Supabase Storage (bucket público "midias", caminhos impossíveis de adivinhar) */
const ASSETS = {
  upload: async (file, opts = {}) => {
    const type = opts.type || file.type || "application/octet-stream";
    const ext = ((file.name || "").split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "bin";
    const id = uid() + uid() + "." + ext;
    const { error } = await sb.storage.from("midias").upload(id, file, { contentType:type, upsert:false, cacheControl:"31536000" });
    if (error) { const m = error.message || ""; throw { code: /size|large|exceed/i.test(m) ? "too_large" : /mime|type/i.test(m) ? "unsupported_type" : "upstream_error", message:m }; }
    return { id, url: BLOB(id), contentType: type, sizeBytes: file.size };
  },
  delete: async id => { await sb.storage.from("midias").remove([id]); return { deleted:true }; }
};

/* IA via função do Supabase (chave fica guardada no servidor) */
async function callIA(input, opts = {}){
  const prompt = typeof input === "string" ? input : input.map(m => m.content).join("\n\n");
  const { data: { session } } = await sb.auth.getSession();
  let r;
  try {
    r = await fetch(SUPA_URL + "/functions/v1/ia", { method:"POST", signal: opts.signal,
      headers: { "Content-Type":"application/json", apikey: SUPA_KEY, Authorization: "Bearer " + (session ? session.access_token : SUPA_KEY) },
      body: JSON.stringify({ prompt }) });
  } catch(e){ if (e && e.name === "AbortError") throw { code:"cancelled" }; throw { code:"upstream_error", message:String(e) }; }
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw { code: d.error === "sem_chave" ? "sem_chave" : d.error === "sem_permissao" ? "not_granted" : r.status === 429 ? "rate_limited" : "upstream_error", message: d.detalhe || d.error || String(r.status) };
  return { text: d.text || "", truncated: !!d.truncated };
}
const SAMPLE = (input, opts) => callIA(input, opts);
SAMPLE.json = async (input, opts) => {
  const { text } = await callIA(input, opts);
  const tryParse = s => { try { return JSON.parse(s); } catch(e){ return undefined; } };
  let v = tryParse(text.trim());
  if (v === undefined) { const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) v = tryParse(m[1].trim()); }
  if (v === undefined) { const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]")); if (a >= 0 && b > a) v = tryParse(text.slice(a, b+1)); }
  if (v === undefined) throw { code:"invalid_json", text };
  return v;
};

/* Equipe: nomes vêm da tabela de perfis */
const TEAM = {};
const USER = {
  me: async () => ({ id:S.me.id, name:S.me.nome || S.me.email, avatarUrl:"", isOwner: S.me.papel === "admin", canEdit:true }),
  id: async () => S.me.id,
  profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, { id:i, name:(TEAM[i] && (TEAM[i].nome || TEAM[i].email)) || "", avatarUrl:"", isMe: i === S.me.id }]))

  });
  return {mrr:Math.round(mrr*100)/100, pont:Math.round(pont*100)/100};
};

let toastTimer;
function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,3200); }
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("#confetti"), ctx=cv.getContext("2d"); cv.hidden=false;
  const W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=["#FF4D6D","#FF9F1C","#FFD23F","#2EC4B6","#3A86FF","#8338EC"];
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*120,y:H*.42,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:5+Math.random()*6,h:10+Math.random()*10,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; (function tick(){ ctx.clearRect(0,0,W,H); ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(++f<120) requestAnimationFrame(tick); else { ctx.clearRect(0,0,W,H); cv.hidden=true; } })();
}

    <div class="head-actions"><button type="button" class="btn" id="btn-hist">${icon(I.clock)}Histórico</button><button type="button" class="btn primary" id="btn-new" ${canWrite?"":"disabled"}>${icon(I.plus)}Nova oportunidade</button></div></div>
    ${banner}${kpis}${toolbar}${body}`;
}

function oppCard(o){
  const st=dueState(o.proximoPasso); const svc=servicesOf(o);
  return `<div class="card" draggable="${S.dbState==="ready"}" data-id="${esc(o.id)}" tabindex="0" role="button" aria-label="Abrir ${esc(o.nome)}">
    <div class="c-top"><div style="min-width:0"><div class="c-name">${esc(o.nome)}</div>${o.handle?`<div class="c-handle">${esc(o.handle)}</div>`:""}</div></div>
    ${valueLine(o)}
    ${(svc.length||o.origem)?`<div class="chips">${svc.map(s=>`<span class="chip svc">${esc(s)}</span>`).join("")}${o.origem?`<span class="chip">${esc(o.origem)}</span>`:""}</div>`:""}
    ${(o.proximoPasso||o.estagio==="ganho"||o.estagio==="perdido")?`<div class="c-foot">${
      o.estagio==="ganho"?`<span>Vendido em ${fmtDay((o.ganhoEm||"").slice(0,10))}</span>`:
      o.estagio==="perdido"?`<span>${esc(o.motivoPerda||"Perdido")}</span>`:
      `<span class="chip ${st||"date"}">${st==="late"?"Atrasado · ":st==="today"?"Hoje · ":"Próximo passo · "}${fmtDay(o.proximoPasso)}</span>`}</div>`:""}
  </div>`;
}

function funnelView(){
  const list=filtered();
  const cols = allStages().map(s=>{
    let items=list.filter(o=>(stageOf(o.estagio).id)===s.id);
    items.sort((a,b)=>(a.proximoPasso||"9999").localeCompare(b.proximoPasso||"9999") || (b.atualizadoEm||"").localeCompare(a.atualizadoEm||""));
    const sum=items.reduce((t,o)=>t+totals(o).mrr,0);
    const terminal = s.id==="ganho"||s.id==="perdido";
    const empty = s.id==="ganho" ? "Arraste aqui quando fechar. O cliente é criado na hora." : s.id==="perdido" ? "Oportunidades que não fecharam ficam aqui, com o motivo." : "Nenhuma oportunidade nesta etapa.";
    return `<section class="col" data-stage="${s.id}" style="--hue:${s.cor}">
      <div class="col-head"><div class="col-title"><span class="dot"></span><span>${esc(s.nome)}</span><span class="c num">${items.length}</span></div>
      <div class="col-sum num">${sum?brl(sum)+"/mês":"&nbsp;"}</div><div class="col-bar"></div></div>
      <div class="cards">${items.length?items.map(oppCard).join(""):`<div class="col-empty">${empty}</div>`}</div>
      ${!terminal && S.dbState==="ready"?`<button type="button" class="col-add" data-add="${s.id}">+ Adicionar</button>`:""}
    </section>`;
  }).join("");
  const firstUse = !S.opps.length && S.dbState==="ready" ? `<div class="empty" style="margin-bottom:16px"><h3>Seu funil está vazio</h3><p>Cadastre a primeira oportunidade com nome, contato, origem e contrato. Quando ela for vendida, arraste o card para Vendido.</p><button type="button" class="btn primary" data-add="lead">${icon(I.plus)}Cadastrar oportunidade</button></div>` : "";
  return firstUse+`<div class="board-wrap"><div class="board">${cols}</div></div>`;
}

function listView(){
  const list=filtered().slice().sort((a,b)=>(b.atualizadoEm||"").localeCompare(a.atualizadoEm||""));
  if(!list.length) return `<div class="empty"><h3>${S.opps.length?"Nada encontrado":"Nenhuma oportunidade ainda"}</h3><p>${S.opps.length?"Ajuste a busca ou os filtros.":"Use “Nova oportunidade” para cadastrar a primeira."}</p></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Oportunidade</th><th>Etapa</th><th>Valor</th><th>Serviços</th><th>Origem</th><th>Próximo passo</th><th>Atualizado</th></tr></thead><tbody>${
    list.map(o=>{ const s=stageOf(o.estagio); const t=totals(o); const st=needsContact(o)?dueState(o.proximoPasso):"";
      return `<tr data-id="${esc(o.id)}" tabindex="0"><td><div class="t-name">${esc(o.nome)}</div><div class="t-sub">${esc([o.handle,o.segmento].filter(Boolean).join(" · "))}</div></td>
      <td><span class="stage-pill" style="--hue:${s.cor}">${esc(s.nome)}</span></td>
      <td class="num">${t.mrr?brl(t.mrr)+"/mês":""}${t.mrr&&t.pont?"<br>":""}${t.pont?`<span class="t-sub">${brl(t.pont)} pontual</span>`:""}${!t.mrr&&!t.pont?'<span class="t-sub">–</span>':""}</td>
      <td><div class="chips">${servicesOf(o).map(x=>`<span class="chip svc">${esc(x)}</span>`).join("")}</div></td>
      <td>${esc(o.origem||"")}</td>
      <td>${o.proximoPasso&&needsContact(o)?`<span class="chip ${st||"date"}">${fmtDay(o.proximoPasso)}</span>`:'<span class="t-sub">–</span>'}</td>
      <td class="t-sub">${fmtWhen(o.atualizadoEm)}</td></tr>`; }).join("")
  }</tbody></table></div>`;
}

function agendaView(){
  const t=todayISO(), wk=addDays(t,7);
  const open=filtered().filter(needsContact);
  const groups=[
    {k:"late", n:"Atrasados", f:o=>o.proximoPasso&&o.proximoPasso<t},
    {k:"today", n:"Hoje", f:o=>o.proximoPasso===t},
    {k:"week", n:"Próximos 7 dias", f:o=>o.proximoPasso>t&&o.proximoPasso<=wk},
    {k:"later", n:"Mais adiante", f:o=>o.proximoPasso>wk},
    {k:"none", n:"Sem data de próximo passo", f:o=>!o.proximoPasso&&isOpen(o)}
  ];
  const html = groups.map(g=>{ const items=open.filter(g.f).sort((a,b)=>(a.proximoPasso||"").localeCompare(b.proximoPasso||"")); if(!items.length) return "";
    return `<section><h3 class="${g.k==="late"?"late":""}">${g.n} <span class="n num">${items.length}</span></h3><div class="ag-list">${items.map(o=>{ const s=stageOf(o.estagio);
      const phone=(o.whatsapp||"").replace(/\D/g,"");
      return `<div class="ag-row"><div class="who"><b>${esc(o.nome)}</b><span>${esc([o.handle, o.whatsapp].filter(Boolean).join(" · "))}</span></div>
        <span class="stage-pill" style="--hue:${s.cor}">${esc(s.nome)}</span>
        <div class="note">${o.proximoPasso?`<b class="num">${fmtDay(o.proximoPasso)}</b> · `:""}${esc(o.notas||"Sem observações")}</div>
        <div class="acts">${phone?`<a class="btn small" href="https://wa.me/${(o.whatsappIntl?"":"55")+phone}" target="_blank" rel="noopener">${icon(I.phone)}WhatsApp</a>`:""}<button type="button" class="btn small" data-contact="${esc(o.id)}" ${S.dbState==="ready"?"":"disabled"}>${icon(I.check)}Registrar contato</button><button type="button" class="btn small" data-open="${esc(o.id)}">Abrir</button></div></div>`; }).join("")}</div></section>`; }).join("");
  return html ? `<div class="agenda">${html}</div>` : `<div class="empty"><h3>Nenhum contato pendente</h3><p>Oportunidades em aberto com “Data do próximo passo” aparecem aqui, das atrasadas para as mais distantes.</p></div>`;
}

function bindCrm(){
  const m=$("#main");
  m.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setView(b.dataset.go));
  const q=$("#q"); if(q){ q.oninput=()=>{ S.q=q.value; const pos=q.selectionStart; render(); const q2=$("#q"); q2.focus(); try{q2.setSelectionRange(pos,pos);}catch(e){} }; }
  $("#f-origem").onchange=e=>{S.fOrigem=e.target.value; render();};
  $("#f-serv").onchange=e=>{S.fServ=e.target.value; render();};
  $("#btn-new").onclick=()=>openOpp(null,"lead");
  $("#btn-hist").onclick=openHistory;
  $("#btn-stages").onclick=openStages;
  m.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openOpp(null,b.dataset.add));
  m.querySelectorAll(".card,[data-open],tbody tr").forEach(el=>{
    const id=el.dataset.id||el.dataset.open;
    el.addEventListener("click",()=>openOpp(id));
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openOpp(id);} });
  });
  m.querySelectorAll("[data-contact]").forEach(b=>b.onclick=e=>{e.stopPropagation(); openContact(b.dataset.contact);});
  // Arrastar entre etapas
  m.querySelectorAll(".card[draggable=true]").forEach(c=>{
    c.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",c.dataset.id); e.dataTransfer.effectAllowed="move"; c.classList.add("dragging"); });
    c.addEventListener("dragend",()=>c.classList.remove("dragging"));
  });
  m.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave",e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove("drop"); });
    col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("drop"); const id=e.dataTransfer.getData("text/plain"); if(id) requestStage(id, col.dataset.stage); });
  });
}
function setView(v){ S.view=v; try{localStorage.setItem("spectra.crm.view",v);}catch(e){} render(); }

/* ================= Escrita ================= */
async function logAct(oppId, nome, tipo, texto){
  if(!S.db) return;
  try{ await S.db.collection("atividades").add({oppId, nome, tipo, texto, por:S.uid||null, em:new Date().toISOString()}); }catch(e){}
}
function writeErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument") toast("Você não tem permissão para editar o CRM. Peça acesso de edição ao Pedro.");
  else if(c==="quota_exceeded") toast("O espaço de dados está cheio. Exclua registros antigos para continuar.");
  else toast("Não foi possível salvar agora. Tente de novo em instantes.");
}

function requestStage(id, stageId){
  const o=S.opps.find(x=>x.id===id); if(!o || o.estagio===stageId) return;
  if(stageId==="ganho") return openWin(o);
  if(stageId==="perdido") return openLost(o);
  moveStage(o, stageId);
}
async function moveStage(o, stageId, extra={}){
  const from=stageOf(o.estagio).nome, to=stageOf(stageId).nome;
  try{
    await S.db.doc("oportunidades/"+o.id).update({estagio:stageId, atualizadoEm:new Date().toISOString(), ...extra});
    logAct(o.id,o.nome,"etapa",`moveu de ${from} para ${to}`);
  }catch(e){ writeErr(e); }
}

async function markWon(o){
  const now=new Date().toISOString(); const t=totals(o); o={...o, contratos:(o.contratos||[]).map(({aberto,confirmRm,...c})=>c)};
  try{
    await S.db.doc("oportunidades/"+o.id).update({estagio:"ganho", ganhoEm:now, atualizadoEm:now, mrr:t.mrr, pontual:t.pont});
    const ref=S.db.doc("clientes/"+o.id); const snap=await ref.get();
    if(!snap.exists){
      await ref.set({
        nome:o.nome, segmento:o.segmento||"", handle:o.handle||"", redes:o.redes||{}, email:o.email||"", whatsapp:o.whatsapp||"", cidade:o.cidade||"",
        contratos:o.contratos||[], servicos:servicesOf(o), mrr:t.mrr, pontual:t.pont,
        tipo: (o.contratos||[]).some(c=>c.tipo!=="Pontual") ? "Recorrente" : "Projeto",
        status:"Ativo", cor:null, fotoId:null, oppId:o.id, criadoEm:now, criadoPor:S.uid||null,
        areaTrabalho:{criada:true, criadaEm:now}, pastas:["A usar","Usados","Brutos"], excluido:false
      });
      logAct(o.id,o.nome,"ganho","marcou como vendido e criou o cliente em Clientes e Tarefas");
    } else {
      await ref.update({status:"Ativo", contratos:o.contratos||[], servicos:servicesOf(o), mrr:t.mrr, pontual:t.pont, atualizadoEm:now});
      logAct(o.id,o.nome,"ganho","marcou como vendido de novo e reativou o cliente");
    }
    closeModal(); confetti(); toast(`${o.nome} vendido! Cliente criado em Clientes.`);
  }catch(e){ writeErr(e); }
}

function closeModal(){ $("#layer").innerHTML=""; S.modal=null; document.removeEventListener("keydown",escClose); }
function escClose(e){ if(e.key==="Escape") (S.ed?closeEditor():closeModal()); }
function mount(html){ $("#layer").innerHTML=html; document.addEventListener("keydown",escClose);
  const sc=$("#layer .scrim"); if(sc) sc.addEventListener("mousedown",e=>{ if(e.target===sc) (S.ed?closeEditor():closeModal()); });
  $("#layer").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); }

const blankContract = n => ({id:uid(), titulo:"", status:"Ativo", tipo:"Recorrente", servicos:[], inicio:"", arquivoUrl:"", arquivoId:"", arquivoNome:"", escopo:"", valor:"", repeticoes:12, periodicidade:"Mensal", pagamento:"PIX", primeiraCobranca:"", aberto:true});

function openOpp(id, stage){
  const o = id ? S.opps.find(x=>x.id===id) : null;
  if (id && !o) return;
  const d = o ? clone(o) : {nome:"", handle:"", segmento:"", status:"Ativo", whatsapp:"", whatsappIntl:false, email:"", cidade:"", origem:"", estagio:stage||"lead", proximoPasso:"", notas:"", redes:{}, contratos:[]};
  d.redes = d.redes||{}; d.contratos=(d.contratos||[]).map(c=>({...c, aberto:false}));
  if(!o && !d.contratos.length){}
  S.modal = {kind:"opp", id:o?o.id:null, d, tab:"basico", confirmDel:false, hist:null};
  drawOpp();
  if(o) loadOppHistory(o.id);
}

function drawOpp(){
  const M=S.modal, d=M.d; const ro = S.dbState!=="ready";
  const t=totals(d);
  const stageOpts = allStages().map(s=>`<option value="${s.id}" ${d.estagio===s.id?"selected":""}>${esc(s.nome)}</option>`).join("");
  const tabs=[["basico","Básico"],["redes","Redes"],["contratos","Contratos"+(d.contratos.length?" ("+d.contratos.length+")":"")]].concat(M.id?[["historico","Histórico"]]:[]);
  let body="";
  if(M.tab==="basico") body=`<div class="grid2">
    <div class="field"><label for="f-nome">Nome *</label><input class="inp" id="f-nome" data-f="nome" value="${esc(d.nome)}" placeholder="Ex.: Clínica Nova Estética"></div>
    <div class="field"><label for="f-handle">@ da principal rede social</label><input class="inp" id="f-handle" data-f="handle" value="${esc(d.handle)}" placeholder="@usuario"></div>
    <div class="field"><label for="f-seg">Segmento / nicho</label><input class="inp" id="f-seg" data-f="segmento" value="${esc(d.segmento)}" placeholder="Ex.: Saúde e bem-estar"></div>
    <div class="field"><label for="f-status">Status</label><select class="inp" id="f-status" data-f="status">${["Ativo","Pausado","Inativo"].map(s=>`<option ${d.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="field"><div class="lbl-row"><label for="f-wpp">WhatsApp</label><label class="toggle">Internacional <input type="checkbox" id="f-intl" data-f="whatsappIntl" ${d.whatsappIntl?"checked":""}></label></div><input class="inp" id="f-wpp" data-f="whatsapp" value="${esc(d.whatsapp)}" placeholder="${d.whatsappIntl?"+1 555 000 0000":"(35) 99999-9999"}" inputmode="tel"></div>
    <div class="field"><label for="f-email">E-mail</label><input class="inp" id="f-email" data-f="email" value="${esc(d.email)}" placeholder="contato@empresa.com" inputmode="email"></div>
    <div class="field"><label for="f-cidade">Estado / cidade</label><input class="inp" id="f-cidade" data-f="cidade" value="${esc(d.cidade)}" placeholder="MG / Monte Sião"></div>
    <div class="field"><label for="f-origem-m">Origem</label><select class="inp" id="f-origem-m" data-f="origem"><option value="">Selecione</option>${ORIGENS.map(x=>`<option ${d.origem===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label for="f-estagio">Etapa do funil</label><select class="inp" id="f-estagio" data-f="estagio">${stageOpts}</select></div>
    <div class="field"><label for="f-prox">Data do próximo passo</label><input class="inp" type="date" id="f-prox" data-f="proximoPasso" value="${esc(d.proximoPasso)}"><span class="hint">Quando chamar a pessoa de novo. Aparece em Próximos contatos e na página inicial.</span></div>
    <div class="field full"><label for="f-notas">Notas internas</label><textarea class="inp" id="f-notas" data-f="notas" placeholder="Observações da negociação, objeções, combinados…">${esc(d.notas)}</textarea></div>
  </div>`;
  else if(M.tab==="redes") body=`<div class="grid2" style="grid-template-columns:minmax(0,1fr)">${REDES.map(r=>{ const link=safeUrl(normLink(r.k,d.redes[r.k]));
    return `<div class="field"><label for="r-${r.k}">${r.n}</label><div class="with-btn"><input class="inp" id="r-${r.k}" data-r="${r.k}" value="${esc(d.redes[r.k]||"")}" placeholder="${esc(r.ph)}">${link?`<a class="icon-btn" style="width:42px;height:42px" href="${esc(link)}" target="_blank" rel="noopener" aria-label="Abrir ${r.n}">${icon(I.ext)}</a>`:`<span class="icon-btn" style="width:42px;height:42px;opacity:.4" aria-hidden="true">${icon(I.ext)}</span>`}</div></div>`; }).join("")}</div>`;
  else if(M.tab==="contratos") body=`<div class="note-box"><b>Os contratos viram o cliente.</b> Quando esta oportunidade for marcada como vendida, os serviços e valores daqui criam o cliente em Clientes e a área de trabalho em Tarefas.</div>
    ${d.contratos.map((c,i)=>contractBlock(c,i)).join("")}
    <button type="button" class="add-contract" id="add-contract" ${ro?"disabled":""}>+ ${d.contratos.length?"Adicionar outro contrato":"Adicionar contrato"}</button>
    ${d.contratos.length?`<div class="calc" style="margin-top:12px"><span>Recorrente: <b>${brl(t.mrr)}/mês</b></span><span>Pontual: <b>${brl(t.pont)}</b></span></div>`:""}`;

    : `${M.id?`<button type="button" class="btn small danger" id="del" ${ro?"disabled":""}>${icon(I.trash)}Excluir</button>`:""}

  const st=stageOf(d.estagio);
  mount(`<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="m-head"><div style="flex:1;min-width:0"><h2 id="m-title">${M.id?esc(d.nome||"Oportunidade"):"Nova oportunidade"}</h2><div class="sub">${M.id?`<span class="stage-pill" style="--hue:${st.cor}">${esc(st.nome)}</span>`:"Preencha o básico agora e complete o contrato quando tiver a proposta."}</div></div><button type="button" class="icon-btn" data-close aria-label="Fechar">${icon(I.x)}</button></div>

    <div class="m-body" id="m-body">${body}</div>
    <div class="m-foot">${foot}</div></div></div>`);
  bindOpp();
}

function contractBlock(c,i){
  const t=totals({contratos:[c]}); const rec=c.tipo!=="Pontual";
  const total = rec ? (Number(c.valor)||0)*(Number(c.repeticoes)||0) : (Number(c.valor)||0);

    <button type="button" class="contract-h" data-toggle="${i}" aria-expanded="${!!c.aberto}"><b>${esc(c.titulo||"Contrato "+(i+1))}</b><span class="status-tag st-${esc(c.status)}">${esc(c.status)}</span><span class="tot num">${rec?(t.mrr?brl(t.mrr)+"/mês":""):(t.pont?brl(t.pont)+" pontual":"")}</span>${icon(I.chev)}</button>
    ${c.aberto?`<div class="contract-b"><div class="grid2">
      <div class="field"><label for="c${i}-titulo">Título do contrato</label><input class="inp" id="c${i}-titulo" data-c="${i}" data-f="titulo" value="${esc(c.titulo)}" placeholder="Ex.: Gestão de redes 2026"></div>
      <div class="field"><label for="c${i}-status">Status do contrato</label><select class="inp" id="c${i}-status" data-c="${i}" data-f="status">${["Ativo","Pausado","Encerrado"].map(s=>`<option ${c.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field full"><span class="flabel">Tipo</span><div class="pick" role="group">${["Recorrente","Pontual"].map(x=>`<button type="button" data-c="${i}" data-pick="tipo" data-v="${x}" aria-pressed="${c.tipo===x}">${x==="Recorrente"?"Recorrente (mensalidade)":"Pontual (projeto)"}</button>`).join("")}</div></div>

async function loadOppHistory(id){
  try{
    const snap=await S.db.collection("atividades").where("oppId","==",id).get();
    const h=snap.docs.map(d=>d.data()).sort((a,b)=>(b.em||"").localeCompare(a.em||""));
