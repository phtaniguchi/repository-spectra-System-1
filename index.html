function redrawBody(){ const keep=$("#m-body")?.scrollTop||0; drawOpp(); const b=$("#m-body"); if(b) b.scrollTop=keep; }

function bindOpp(){
  const M=S.modal, d=M.d, L=$("#layer");
  L.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ M.tab=b.dataset.tab; drawOpp(); });
  L.querySelectorAll("[data-f]:not([data-c])").forEach(el=>{
    const ev = el.type==="checkbox"||el.tagName==="SELECT"||el.type==="date" ? "change" : "input";
    el.addEventListener(ev,()=>{ d[el.dataset.f] = el.type==="checkbox" ? el.checked : el.value; el.classList.remove("err");
      if(el.dataset.f==="whatsappIntl"){ const w=$("#f-wpp"); if(w) w.placeholder = el.checked?"+1 555 000 0000":"(35) 99999-9999"; }
      if(el.dataset.f==="nome" && M.id){ $("#m-title").textContent=el.value||"Oportunidade"; } });
  });
  L.querySelectorAll("[data-r]").forEach(el=>el.addEventListener("input",()=>{ d.redes[el.dataset.r]=el.value; }));
  L.querySelectorAll("[data-r]").forEach(el=>el.addEventListener("change",()=>redrawBody()));
  L.querySelectorAll("[data-c][data-f]").forEach(el=>{
    const ev = el.tagName==="SELECT"||el.type==="date" ? "change" : "input";
    el.addEventListener(ev,()=>{ const c=d.contratos[+el.dataset.c]; if(el.readOnly) return; c[el.dataset.f]=el.value;
      if(["valor","repeticoes","periodicidade","status","titulo"].includes(el.dataset.f)) refreshCalc(+el.dataset.c); });
  });
  L.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{ const c=d.contratos[+b.dataset.toggle]; c.aberto=!c.aberto; redrawBody(); });
  L.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ d.contratos[+b.dataset.c][b.dataset.pick]=b.dataset.v; redrawBody(); });
  L.querySelectorAll("[data-multi]").forEach(b=>b.onclick=()=>{ const c=d.contratos[+b.dataset.c]; const arr=c.servicos||(c.servicos=[]); const v=b.dataset.v; const k=arr.indexOf(v); if(k>=0) arr.splice(k,1); else arr.push(v); b.setAttribute("aria-pressed",k<0); });
  L.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ d.contratos[+b.dataset.rm].confirmRm=true; redrawBody(); });
  L.querySelectorAll("[data-rmno]").forEach(b=>b.onclick=()=>{ d.contratos[+b.dataset.rmno].confirmRm=false; redrawBody(); });
  L.querySelectorAll("[data-rmyes]").forEach(b=>b.onclick=()=>{ d.contratos.splice(+b.dataset.rmyes,1); redrawBody(); });
  L.querySelectorAll("[data-unfile]").forEach(b=>b.onclick=()=>{ const c=d.contratos[+b.dataset.unfile]; c.arquivoId=""; c.arquivoNome=""; redrawBody(); });
  L.querySelectorAll("[data-file]").forEach(inp=>inp.onchange=async()=>{
    const f=inp.files[0]; if(!f||!S.assets) return; const c=d.contratos[+inp.dataset.file];
    toast("Enviando arquivo…");
    try{ const r=await S.assets.upload(f,{type:f.type||"application/pdf"}); c.arquivoId=r.id; c.arquivoNome=f.name; c.arquivoUrl=""; toast("Arquivo anexado. Salve para manter."); redrawBody(); }
    catch(e){ toast(e&&e.code==="too_large"?"O arquivo passa de 20 MB.":e&&e.code==="unsupported_type"?"Envie PDF, PNG ou JPG.":"Não foi possível enviar o arquivo."); }
  });
  const add=$("#add-contract"); if(add) add.onclick=()=>{ const c=blankContract(); if(!d.contratos.length && d.nome) c.titulo="Contrato – "+d.nome; d.contratos.forEach(x=>x.aberto=false); d.contratos.push(c); redrawBody(); };
  const del=$("#del"); if(del) del.onclick=()=>{ M.confirmDel=true; drawOpp(); };
  const dn=$("#del-no"); if(dn) dn.onclick=()=>{ M.confirmDel=false; drawOpp(); };
  const dy=$("#del-yes"); if(dy) dy.onclick=deleteOpp;
  const sv=$("#save"); if(sv) sv.onclick=()=>saveOpp();
  const mw=$("#mark-won"); if(mw) mw.onclick=async()=>{ const b=await saveOpp(true); if(b) openWin(b); };
  const ml=$("#mark-lost"); if(ml) ml.onclick=async()=>{ const b=await saveOpp(true); if(b) openLost(b); };
  if(M.tab==="basico" && !M.id){ const n=$("#f-nome"); if(n && !n.value) n.focus(); }
}
function refreshCalc(i){
  // Atualiza só os totais sem redesenhar os campos (mantém o foco)
  const d=S.modal.d, c=d.contratos[i]; const box=$(`.contract[data-ci="${i}"]`); if(!box) return;
  const t=totals({contratos:[c]}), rec=c.tipo!=="Pontual";
  const total = rec ? (Number(c.valor)||0)*(Number(c.repeticoes)||0) : (Number(c.valor)||0);
  box.querySelector(".contract-h b").textContent=c.titulo||"Contrato "+(i+1);
  const tag=box.querySelector(".status-tag"); tag.className="status-tag st-"+c.status; tag.textContent=c.status;
  box.querySelector(".tot").textContent = rec?(t.mrr?brl(t.mrr)+"/mês":""):(t.pont?brl(t.pont)+" pontual":"");
  const calc=box.querySelector(".calc"); if(calc) calc.innerHTML=`<span>Total do contrato: <b>${brl(total)}</b></span>${rec?`<span>Equivale a <b>${brl(t.mrr)}/mês</b></span>`:`<span>${Number(c.repeticoes)>1?`${esc(c.repeticoes)}x de <b>${brl(total/(Number(c.repeticoes)||1))}</b>`:"à vista"}</span>`}`;
  const all=totals(d); const sum=$("#m-body > .calc"); if(sum) sum.innerHTML=`<span>Recorrente: <b>${brl(all.mrr)}/mês</b></span><span>Pontual: <b>${brl(all.pont)}</b></span>`;
}

async function saveOpp(keepOpen){
  const M=S.modal, d=M.d;
  if(!d.nome.trim()){ M.tab="basico"; drawOpp(); const n=$("#f-nome"); n.classList.add("err"); n.focus(); toast("Dê um nome para a oportunidade."); return false; }
  const now=new Date().toISOString(); const t=totals(d);
  const body={ nome:d.nome.trim(), handle:(d.handle||"").trim(), segmento:(d.segmento||"").trim(), status:d.status, whatsapp:(d.whatsapp||"").trim(), whatsappIntl:!!d.whatsappIntl,
    email:(d.email||"").trim(), cidade:(d.cidade||"").trim(), origem:d.origem||"", estagio:d.estagio, proximoPasso:d.proximoPasso||"", notas:d.notas||"",
    redes:Object.fromEntries(Object.entries(d.redes||{}).map(([k,v])=>[k,(v||"").trim()]).filter(([k,v])=>v)),
    contratos:d.contratos.map(({aberto,confirmRm,...c})=>({...c, valor:c.valor===""?"":Number(c.valor), repeticoes:Number(c.repeticoes)||1})),
    servicos:servicesOf(d), mrr:t.mrr, pontual:t.pont, atualizadoEm:now };
  try{
    if(M.id){
      const prev=S.opps.find(x=>x.id===M.id)||{};
      // Mover para Vendido/Perdido pelo seletor passa pelo fluxo próprio
      const wantsWon = body.estagio==="ganho" && prev.estagio!=="ganho";
      const wantsLost = body.estagio==="perdido" && prev.estagio!=="perdido";
      if(wantsWon||wantsLost) body.estagio=prev.estagio||"lead";
      await S.db.doc("oportunidades/"+M.id).update(body);
      const changes=[]; if(prev.estagio!==body.estagio) changes.push(`moveu de ${stageOf(prev.estagio).nome} para ${stageOf(body.estagio).nome}`);
      if((prev.proximoPasso||"")!==body.proximoPasso && body.proximoPasso) changes.push(`marcou o próximo passo para ${fmtDay(body.proximoPasso)}`);
      if(JSON.stringify(prev.contratos||[])!==JSON.stringify(body.contratos)) changes.push("atualizou os contratos");
      if(changes.length) logAct(M.id, body.nome, "edicao", changes.join(", ")); else if(!keepOpen) logAct(M.id, body.nome, "edicao", "editou os dados");
      if(wantsWon){ openWin({...prev,...body,id:M.id}); return false; }
      if(wantsLost){ openLost({...prev,...body,id:M.id}); return false; }
      if(!keepOpen){ closeModal(); toast("Alterações salvas."); }
    } else {
      body.criadoEm=now; body.criadoPor=S.uid||null;
      const wantsWon=body.estagio==="ganho", wantsLost=body.estagio==="perdido";
      if(wantsWon||wantsLost) body.estagio="negociacao";
      const ref=S.db.collection("oportunidades").doc(uid()); await ref.set(body);
      logAct(ref.id, body.nome, "criacao", `cadastrou a oportunidade em ${stageOf(body.estagio).nome}`);
      M.id=ref.id;
      if(wantsWon){ openWin({...body,id:ref.id}); return false; }
      if(wantsLost){ openLost({...body,id:ref.id}); return false; }
      if(!keepOpen){ closeModal(); toast("Oportunidade criada."); }
    }
    return {...body, id:M.id};
  }catch(e){ writeErr(e); return false; }
}

/* Datas comemorativas (Brasil) */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da,12); }
function nthDow(y,m,dow,n){ const d=new Date(y,m-1,1,12); let c=0; while(true){ if(d.getDay()===dow && ++c===n) return isoDay(d); d.setDate(d.getDate()+1); } }
const commCache = {};
function commemoratives(y){
  if (commCache[y]) return commCache[y];
  const f = {"01-01":"Ano Novo","03-08":"Dia Internacional da Mulher","03-15":"Dia do Consumidor","04-21":"Tiradentes","05-01":"Dia do Trabalho","06-12":"Dia dos Namorados","06-24":"São João","07-20":"Dia do Amigo","09-07":"Independência do Brasil","09-15":"Dia do Cliente","10-12":"Dia das Crianças · N. Sra. Aparecida","10-15":"Dia do Professor","11-02":"Finados","11-15":"Proclamação da República","11-20":"Dia da Consciência Negra","12-25":"Natal","12-31":"Véspera de Ano Novo"};
  const out = {}; Object.entries(f).forEach(([md,n])=>out[y+"-"+md]=n);
  const e=easter(y); const add=(d,n)=>{ const x=new Date(e); x.setDate(x.getDate()+d); out[isoDay(x)]=n; };
  add(-47,"Carnaval"); add(-2,"Sexta-feira Santa"); add(0,"Páscoa"); add(60,"Corpus Christi");
  out[nthDow(y,5,0,2)]="Dia das Mães"; out[nthDow(y,8,0,2)]="Dia dos Pais";
  const bf=new Date(nthDow(y,11,4,4)+"T12:00:00"); bf.setDate(bf.getDate()+1); out[isoDay(bf)]="Black Friday";
  return commCache[y]=out;
}
const commsInMonth = ym => { const y=+ym.slice(0,4); return Object.entries(commemoratives(y)).filter(([d])=>d.slice(0,7)===ym).sort(); };

function bindClients(){

  $("#cq").oninput=e=>{ S.cq=e.target.value; render(); };
  $("#cstatus").onchange=e=>{ S.cstatus=e.target.value; render(); };
  $("#ctipo").onchange=e=>{ S.ctipo=e.target.value; render(); };
  m.querySelectorAll(".ccard").forEach(card=>{
    const go=()=>{ location.hash="c-"+card.dataset.cid; };

async function uploadPhoto(id,file){
  if(!file||!S.assets) return; toast("Enviando foto…");
  try{ const r=await S.assets.upload(file,{type:file.type||"image/png"}); await S.db.doc("clientes/"+id).update({fotoId:r.id}); toast("Foto atualizada."); }
  catch(e){ toast(e&&e.code==="unsupported_type"?"Envie PNG, JPG, WEBP ou SVG.":e&&e.code==="too_large"?"A imagem passa do limite de tamanho.":"Não foi possível enviar a foto."); }
}

  const d = c ? clone(c) : {nome:"",segmento:"",handle:"",status:"Ativo",tipo:"Recorrente",redes:{},cor:null,fotoId:null,email:"",whatsapp:"",cidade:""};
  d.redes=d.redes||{};
  S.modal={kind:"client", id, d, confirm:null};
  drawClientEdit();
}

        ${d.fotoId?`<button type="button" class="btn small" id="ce-nophoto">Remover foto</button>`:""}
        <div class="swatches">${COVERS.slice(0,10).map(h=>`<button type="button" style="background:${h}" data-ccor="${h}" aria-pressed="${d.cor===h}" aria-label="Cor ${h}"></button>`).join("")}</div></div></div>
      <div class="field"><label for="ce-nome">Nome *</label><input class="inp" id="ce-nome" data-cf="nome" value="${esc(d.nome)}"></div>

      <div class="field"><label for="ce-cidade">Estado / cidade</label><input class="inp" id="ce-cidade" data-cf="cidade" value="${esc(d.cidade)}"></div>
      <div class="field"><label for="ce-status">Status do contrato</label><select class="inp" id="ce-status" data-cf="status">${["Ativo","Pausado","Encerrado"].map(s=>`<option ${d.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label for="ce-tipo">Tipo</label><select class="inp" id="ce-tipo" data-cf="tipo">${["Recorrente","Projeto"].map(s=>`<option ${d.tipo===s?"selected":""}>${s}</option>`).join("")}</select></div>

  const ph=$("#ce-photo"); if(ph) ph.onchange=async()=>{ const f=ph.files[0]; if(!f) return; toast("Enviando foto…");

  const np=$("#ce-nophoto"); if(np) np.onclick=()=>{ d.fotoId=null; drawClientEdit(); };
  const q=id=>$(id);
  if(q("#ce-del")) q("#ce-del").onclick=()=>{ M.confirm="soft"; drawClientEdit(); };

  if(q("#ce-no")) q("#ce-no").onclick=()=>{ M.confirm=null; drawClientEdit(); };
  if(q("#ce-soft")) q("#ce-soft").onclick=async()=>{ try{ await S.db.doc("clientes/"+M.id).update({excluido:true, excluidoEm:new Date().toISOString()}); closeModal(); toast("Cliente movido para Excluídos."); if(S.clientId===M.id) location.hash="clientes"; }catch(e){ writeErr(e); } };
  if(q("#ce-restore")) q("#ce-restore").onclick=async()=>{ try{ await S.db.doc("clientes/"+M.id).update({excluido:false}); closeModal(); toast("Cliente restaurado."); }catch(e){ writeErr(e); } };
  if(q("#ce-hard")) q("#ce-hard").onclick=()=>hardDeleteClient(M.id);

async function saveClient(){
  const M=S.modal, d=M.d;
  if(!(d.nome||"").trim()){ const n=$("#ce-nome"); n.classList.add("err"); n.focus(); toast("Dê um nome ao cliente."); return; }
  const now=new Date().toISOString();
  const body={nome:d.nome.trim(), segmento:(d.segmento||"").trim(), handle:(d.handle||"").trim(), cidade:(d.cidade||"").trim(), status:d.status||"Ativo", tipo:d.tipo||"Recorrente",
    mrr:Number(d.mrr)||0, whatsapp:(d.whatsapp||"").trim(), cor:d.cor||null, fotoId:d.fotoId||null,
    redes:Object.fromEntries(Object.entries(d.redes||{}).map(([k,v])=>[k,(v||"").trim()]).filter(([k,v])=>v)), atualizadoEm:now};
  try{
    if(M.id) await S.db.doc("clientes/"+M.id).update(body);
    else { const id=uid(); await S.db.doc("clientes/"+id).set({...body, criadoEm:now, criadoPor:S.uid||null, pastas:PASTAS_PADRAO, contratos:[], servicos:[], oppId:null, excluido:false}); closeModal(); toast("Cliente criado."); location.hash="c-"+id; return; }
    closeModal(); toast("Cliente atualizado.");
  }catch(e){ writeErr(e); }
}
async function hardDeleteClient(id){
  toast("Apagando…");
  try{
    for (const col of ["posts","criativo","arquivos","mensagens"]){
      const s=await S.db.collection(col).where("clienteId","==",id).get();
      for (const d of s.docs) await S.db.doc(col+"/"+d.id).delete();
    }
    await S.db.doc("briefings/"+id).delete(); await S.db.doc("clientes/"+id).delete();
    closeModal(); toast("Cliente apagado."); if(S.clientId===id) location.hash="clientes";
  }catch(e){ writeErr(e); }
}

        ${S.csMenu?`<div class="menu"><button type="button" id="cs-edit">${icon(CI.pen)}Editar</button><button type="button" class="danger" id="cs-del">${icon(I.trash)}Excluir</button></div>`:""}</div>
    </div></div>
    <div class="ctabs" role="tablist">${CTABS.map(([k,n])=>`<button type="button" role="tab" data-ctab="${k}" aria-selected="${S.ctab===k}">${icon(CI[k])}${n}</button>`).join("")}</div>`;
  let body="";
  if(S.ctab==="conteudo") body=contentTab(c);

function bindClientSpace(){
  const c=curClient(); if(!c) return;
  const m=$("#main");
  m.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{ S.ctab=b.dataset.ctab; S.csMenu=false; render(); });
  const mn=$("#cs-menu"); if(mn) mn.onclick=()=>{ S.csMenu=!S.csMenu; render(); };
  const ed=$("#cs-edit"); if(ed) ed.onclick=()=>{ S.csMenu=false; render(); openClientEdit(c.id); };
  const dl=$("#cs-del"); if(dl) dl.onclick=()=>{ S.csMenu=false; render(); openClientEdit(c.id); S.modal.confirm="soft"; drawClientEdit(); };

/* ---------- Conteúdo: calendário ---------- */
function monthWeeks(ym){ const [y,m]=ym.split("-").map(Number); const last=new Date(y,m,0).getDate(); const w=[]; let d=1;
  while(d<=last){ const dow=new Date(y,m-1,d,12).getDay(); const end=Math.min(last,d+(6-dow)); w.push([d,end]); d=end+1; } return w; }
function shiftMonth(ym,n){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1,12); return ymOf(d); }
const fmtDH = p => fmtDay(p.data)+(p.hora?" · "+p.hora:"");
function postCard(p){
  return `<button type="button" class="pcard" data-pid="${esc(p.id)}" style="--sc:${aprovC(p.status)}"><div class="pt"><b>${esc(p.titulo||"Sem título")}</b><time>${fmtDH(p)}</time></div>
    <div class="chips"><span class="chip">${esc(p.formato||"")}</span><span class="st-dot" style="--sc:${aprovC(p.status)}">${esc(p.status)}</span>${p.veiculacao&&p.veiculacao!=="Não programado"?`<span class="st-dot" style="--sc:${veicC(p.veiculacao)}">${esc(p.veiculacao)}</span>`:""}</div></button>`;
}
function contentTab(c){
  const ym=S.cmonth; const [y,mo]=ym.split("-").map(Number);
  const all=S.cposts.filter(p=>p.mes===ym);
  const posts=all.filter(p=>(!S.cfFormato||p.formato===S.cfFormato)&&(!S.cfStatus||p.status===S.cfStatus));
  const comms=commsInMonth(ym); const canW=S.dbState==="ready";
  const bar=`<div class="monthbar"><button type="button" class="icon-btn" id="m-prev" aria-label="Mês anterior">${icon(CI.back)}</button><span class="mname">${MESES_L[mo-1]} ${y}</span><button type="button" class="icon-btn" id="m-next" aria-label="Próximo mês">${icon(CI.fwd)}</button>
    ${ym!==ymOf(new Date())?`<button type="button" class="btn small" id="m-today">Hoje</button>`:""}
    <div class="stats">${APROV.map(a=>`<span style="--sc:${a.c}"><b>${all.filter(p=>p.status===a.k).length}</b>${a.k}</span>`).join("")}</div></div>
    <div class="toolbar"><div class="seg" role="group" aria-label="Visualização">${[["semanal","Semanal"],["mensal","Mensal"],["feed","Feed"]].map(([k,n])=>`<button type="button" data-cview="${k}" aria-pressed="${S.cview===k}">${n}</button>`).join("")}</div>
      <select class="select" id="cf-formato" aria-label="Formato"><option value="">Todos os formatos</option>${FORMATOS.map(f=>`<option ${S.cfFormato===f.k?"selected":""}>${f.k}</option>`).join("")}</select>
      <select class="select" id="cf-status" aria-label="Status"><option value="">Todos os status</option>${APROV.map(a=>`<option ${S.cfStatus===a.k?"selected":""}>${a.k}</option>`).join("")}</select>
      <span style="flex:1"></span>
      ${S.sample?`<button type="button" class="btn ai-btn" id="plan-ai" ${canW?"":"disabled"}>${icon(CI.spark)}Planejar o mês com IA</button>`:""}
      <button type="button" class="btn primary" id="post-new" ${canW?"":"disabled"}>${icon(I.plus)}Novo conteúdo</button></div>`;
  let view;
  if(!S.cLoaded||!S.cLoaded.posts) view=`<div class="skeleton" style="height:200px"></div>`;
  else if(S.cview==="mensal"){
    const first=new Date(y,mo-1,1,12); const start=new Date(first); start.setDate(1-first.getDay());
    const cm=commemoratives(y); const t=todayISO(); let cells="";
    for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const iso=isoDay(d); const inM=d.getMonth()===mo-1;
      if(i>=35 && !inM && d.getDate()<8 && i%7===0) break;
      const dp=inM?sortPosts(posts.filter(p=>p.data===iso)):[];
      cells+=`<div class="day ${inM?"":"out"} ${iso===t?"today":""}" ${inM&&canW?`data-day="${iso}"`:""}><span class="dn">${d.getDate()}</span>${inM&&cm[iso]?`<span class="mini c">${esc(cm[iso])}</span>`:""}${dp.slice(0,3).map(p=>`<button type="button" class="mini" data-pid="${esc(p.id)}" style="--sc:${aprovC(p.status)}">${p.hora?esc(p.hora)+" ":""}${esc(p.titulo||"Sem título")}</button>`).join("")}${dp.length>3?`<span class="more">+${dp.length-3}</span>`:""}</div>`; }
    view=`<div class="month-wrap"><div class="month">${DOWS.map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div></div>`;
  } else if(S.cview==="feed"){
    const fp=sortPosts(posts).reverse();
    view = fp.length ? `<div class="feed" style="--cc:${esc(coverOf(c))}">${fp.map(p=>{ const a=coverAsset(p);
      return `<button type="button" class="ftile" data-pid="${esc(p.id)}" style="--sc:${aprovC(p.status)}" aria-label="${esc(p.titulo)}">${a&&isImg(a.tipo)?`<img alt="" src="${esc(BLOB(a.id))}">`:""}<i></i>${a&&isImg(a.tipo)?"":`<span>${esc(p.titulo||"Sem título")}</span>`}</button>`; }).join("")}</div>`
      : `<div class="empty"><h3>Nada no feed de ${MESES_L[mo-1]}</h3><p>Os posts do mês aparecem aqui na ordem do perfil, do mais recente para o mais antigo.</p></div>`;
  } else {
    const weeks=monthWeeks(ym);
    view=`<div class="weeks-wrap"><div class="weeks">${weeks.map(([a,b],i)=>{ const da=ym+"-"+pad(a), db=ym+"-"+pad(b);
      const items=[...comms.filter(([d])=>d>=da&&d<=db).map(([d,n])=>({c:1,data:d,n})), ...posts.filter(p=>p.data>=da&&p.data<=db)].sort((x,z)=>((x.data||"")+(x.c?"0":"1")+(x.hora||"")).localeCompare((z.data||"")+(z.c?"0":"1")+(z.hora||"")));
      return `<section class="week"><div class="week-h"><div><b>Semana ${i+1}</b><span>${a} – ${b} ${MESES[mo-1]}</span></div>${canW?`<button type="button" class="icon-btn" data-newat="${da<todayISO()&&db>=todayISO()?todayISO():da}" aria-label="Novo conteúdo na semana ${i+1}">${icon(I.plus)}</button>`:""}</div>
        ${items.map(it=>it.c?`<div class="comm">${esc(it.n)}<small>${fmtDay(it.data)}</small></div>`:postCard(it)).join("")}</section>`; }).join("")}</div></div>`;
    if(!all.length && S.cLoaded.posts) view = `<div class="empty" style="margin-bottom:14px"><h3>Nenhum conteúdo em ${MESES_L[mo-1]}</h3><p>Crie posts um a um ou deixe a IA montar o planejamento do mês a partir do briefing, com tema, roteiro, direção de gravação e legenda.</p></div>`+view;
  }
  return bar+view;
}

async function newPost(c, data, extra={}){
  const id=uid(); const now=new Date().toISOString();
  const num=Math.max(0,...S.cposts.map(p=>Number(p.num)||0))+1;
  const body={clienteId:c.id, num, titulo:"Novo conteúdo", data, hora:"10:00", mes:data.slice(0,7), formato:"Reels", redes:["instagram"], tags:[],
    etapas:emptySteps(), status:"Rascunho", veiculacao:"Não programado", criadoEm:now, atualizadoEm:now, criadoPor:S.uid||null, ...extra};
  body.status=overall(body.etapas);
  try{ await S.db.doc("posts/"+id).set(body); if(!extra.silent) openPost(id, {id,...body}); return id; }catch(e){ writeErr(e); return null; }
}
function openPost(id, initial){
  const p = initial || S.cposts.find(x=>x.id===id); if(!p) return;
  S.ed={id, d:normPost(clone(p)), step:S.ed&&S.ed.id===id?S.ed.step:"tema", side:null, dirty:false, saving:false, timer:null, confirmDel:false, ai:null};
  S.modal={kind:"post"};
  drawEditor();
}
function edSchedule(){ const E=S.ed; if(!E) return; E.dirty=true; setSaveLabel("Editando…"); clearTimeout(E.timer); E.timer=setTimeout(()=>edSave(),900); }
function setSaveLabel(t){ const el=$("#ed-save"); if(el) el.textContent=t; }
async function edSave(){
  const E=S.ed; if(!E) return; clearTimeout(E.timer); E.timer=null;
  if(E.saving){ E.again=true; return; }
  if(!E.dirty) return;
  E.saving=true; E.dirty=false; setSaveLabel("Salvando…");
  const d=E.d; d.status=overall(d.etapas); d.mes=(d.data||"").slice(0,7);
  try{ await S.db.doc("posts/"+E.id).update({titulo:d.titulo, data:d.data, hora:d.hora, mes:d.mes, formato:d.formato, redes:d.redes, tags:d.tags||[], etapas:d.etapas, status:d.status, veiculacao:d.veiculacao, atualizadoEm:new Date().toISOString()});
    if(S.ed===E) setSaveLabel("Salvo"); }
  catch(e){ E.dirty=true; if(S.ed===E) setSaveLabel("Não salvou"); writeErr(e); }
  E.saving=false; if(E.again){ E.again=false; if(E.dirty) edSave(); }
}
async function closeEditor(){ const E=S.ed; if(E&&E.timer){ await edSave(); } if(E&&E.convUnsub){ E.convUnsub(); } S.ed=null; closeModal(); }

function planSlots(ym, qty, days, mix){
  const [y,m]=ym.split("-").map(Number); const last=new Date(y,m,0).getDate(); const t=todayISO();
  let dates=[]; for(let d=1;d<=last;d++){ const iso=ym+"-"+pad(d); if(iso<t) continue; if(days.includes(new Date(y,m-1,d,12).getDay())) dates.push(iso); }
  if(!dates.length) return [];
  const picked=[]; for(let i=0;i<qty;i++){ picked.push(dates[Math.min(dates.length-1,Math.floor(i*dates.length/qty))]); }
  const fmts=[]; const pool=Object.entries(mix).filter(([k,n])=>n>0).map(([k,n])=>[k,n]);
  while(fmts.length<qty && pool.some(p=>p[1]>0)){ for(const p of pool){ if(p[1]>0&&fmts.length<qty){ fmts.push(p[0]); p[1]--; } } }
  while(fmts.length<qty) fmts.push("Reels");
  return picked.map((data,i)=>({data, formato:fmts[i]}));
}

async function runPlan(c, slots, draw){

function parseQuestions(t){ const out=[]; let cur=null; (t||"").split("\n").forEach(l=>{ const s=l.trim(); if(!s) return; if(s.startsWith("## ")){ cur={t:s.slice(3),q:[]}; out.push(cur); } else { if(!cur){ cur={t:"Perguntas",q:[]}; out.push(cur); } cur.q.push(s.replace(/^[-*\d.)\s]+/,"")); } }); return out.filter(s=>s.q.length); }
async function saveBrief(id, patch){ const ref=S.db.doc("briefings/"+id); const s=await ref.get(); const body={...patch, atualizadoEm:new Date().toISOString()}; if(s.exists) await ref.update(body); else await ref.set({clienteId:id, ...body}); }

  const bs=$("#ba-save"); if(bs) bs.onclick=async()=>{ try{ await saveBrief(c.id,{respostas:S.bDraft, respostasEm:new Date().toISOString()}); toast("Respostas salvas."); }catch(e){ writeErr(e); } };
  const be=$("#bq-edit"); if(be) be.onclick=()=>{ S.bqEdit=true; render(); };
  const bc=$("#bq-cancel"); if(bc) bc.onclick=()=>{ S.bqEdit=false; render(); };
  const bsv=$("#bq-save"); if(bsv) bsv.onclick=async()=>{ try{ await saveBrief(c.id,{perguntas:$("#bq-text").value}); S.bqEdit=false; toast("Perguntas salvas."); render(); }catch(e){ writeErr(e); } };
  const cp=$("#bq-copy"); if(cp) cp.onclick=async()=>{ const t=parseQuestions(S.brief.perguntas).map(s=>s.t.toUpperCase()+"\n"+s.q.map((q,i)=>`${i+1}. ${q}`).join("\n")).join("\n\n");
    try{ await navigator.clipboard.writeText(t); toast("Perguntas copiadas."); }catch(e){ S.bqEdit=true; render(); const x=$("#bq-text"); x.focus(); x.select(); toast("Selecione e copie com Ctrl+C."); } };
  const ai=$("#bq-ai"); if(ai) ai.onclick=async()=>{ S.bqAi=true; render();
    const prompt=`Você é estrategista da Spectra, agência de marketing brasileira que cuida de redes sociais (tráfego orgânico), tráfego pago e apoio comercial. Monte o roteiro de perguntas para a reunião de briefing (onboarding) com o cliente abaixo. As perguntas devem ser específicas para o nicho, em português do Brasil, abertas e fáceis de responder numa conversa.

Cliente: ${c.nome}
Segmento/nicho: ${c.segmento||"não informado"}
${c.cidade?`Cidade: ${c.cidade}\n`:""}Serviços contratados: ${(c.servicos||[]).join(", ")||"gestão de redes sociais"}
${(c.contratos||[]).map(k=>k.escopo).filter(Boolean).length?`Escopo: ${(c.contratos||[]).map(k=>k.escopo).filter(Boolean).join(" | ")}\n`:""}
Cubra: história e essência da marca; produtos/serviços e carro-chefe; público e persona; diferenciais e concorrentes; tom de voz e identidade visual; objetivos e metas; rotina para captação de conteúdo (quem aparece, locais, frequência); limites e o que evitar; tráfego pago e comercial se fizer parte dos serviços.
Responda só com um array JSON de 7 a 9 seções: [{"secao": string, "perguntas": [string, ...] (4 a 6 por seção)}].`;
    try{ const arr=await S.sample.json(prompt,{cache:false}); const txt=(Array.isArray(arr)?arr:[]).map(s=>"## "+String(s.secao||"Seção")+"\n"+(s.perguntas||[]).map(q=>"- "+String(q)).join("\n")).join("\n\n");
      if(!txt) throw {code:"invalid_json"}; await saveBrief(c.id,{perguntas:txt, perguntasEm:new Date().toISOString()}); toast("Briefing gerado."); }
    catch(e){ const m=aiErr(e); if(m) toast(m); }
    S.bqAi=false; render(); };
  const bd=$("#bd-ai"); if(bd) bd.onclick=async()=>{ S.bdAi=true; render();
    const prompt=`Leia as respostas da reunião de briefing do cliente ${c.nome} (${c.segmento||"nicho não informado"}) e extraia as diretrizes de comunicação em português do Brasil, de forma objetiva e acionável para quem cria posts.

Respostas:
${(S.brief.respostas||"").slice(0,24000)}

Responda só com um objeto JSON: {"publico": string, "tomDeVoz": string, "pilares": [string, 3 a 5 itens], "diferenciais": string, "objetivos": string, "evitar": string}. Se algo não estiver nas respostas, escreva "Não informado".`;
    try{ const r=await S.sample.json(prompt,{cache:false}); await saveBrief(c.id,{diretrizes:{publico:String(r.publico||""),tomDeVoz:String(r.tomDeVoz||""),pilares:(r.pilares||[]).map(String),diferenciais:String(r.diferenciais||""),objetivos:String(r.objetivos||""),evitar:String(r.evitar||"")}}); toast("Diretrizes atualizadas."); }
    catch(e){ const m=aiErr(e); if(m) toast(m); }
    S.bdAi=false; render(); };
}

/* ---------- Redes sociais ---------- */
function netsTab(c){
  const r=c.redes||{};
  return `<div class="sec-head"><h3>Perfis do cliente</h3>${S.dbState==="ready"?`<button type="button" class="btn small" id="n-edit">${icon(CI.pen).replace("<svg",'<svg style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2"')}Editar perfis</button>`:""}</div>
    <div class="nets">${REDES.map(x=>{ const v=r[x.k]; const link=safeUrl(normLink(x.k,v)); return `<div class="net" style="--tc:${NET_COLORS[x.k]}"><i>${x.n[0]}</i><div><b>${x.n}</b><span>${esc(v||"Não informado")}</span></div>${link?`<a class="icon-btn" href="${esc(link)}" target="_blank" rel="noopener" aria-label="Abrir ${x.n}">${icon(I.ext)}</a>`:""}</div>`; }).join("")}</div>
    <div class="note-box" style="margin-top:16px"><b>Métricas e publicação automática ainda não estão ligadas.</b> Por enquanto a programação dos posts é marcada à mão no editor (Prog. manual / Publicado). A conexão direta com Instagram e Facebook entra numa próxima etapa.</div>`;
}
function bindNets(c){ const e=$("#n-edit"); if(e) e.onclick=()=>openClientEdit(c.id); }

/* ---------- Mensagens internas ---------- */
function msgTab(c){
  const canW=S.dbState==="ready";
  return `<div class="chat-panel"><div class="chat" id="chat">${S.cmsgs.length?S.cmsgs.map(msgHTML).join(""):`<div class="empty" style="border:0"><p>Mensagens internas da equipe sobre ${esc(c.nome)}. O cliente não vê este espaço.</p></div>`}</div>
    <div class="composer"><textarea class="inp" id="msg-in" placeholder="Escreva para a equipe…" aria-label="Mensagem" ${canW?"":"disabled"}>${esc(S.msgDraft||"")}</textarea><button type="button" class="btn primary" id="msg-send" aria-label="Enviar" ${canW?"":"disabled"}>${icon(CI.send)}</button></div></div>`;
}
function bindMsg(c){
  const ch=$("#chat"); if(ch) ch.scrollTop=ch.scrollHeight;
  const inp=$("#msg-in"); if(!inp) return; inp.oninput=()=>{ S.msgDraft=inp.value; };
  const send=async()=>{ const t=(S.msgDraft||"").trim(); if(!t) return; S.msgDraft="";
    try{ await S.db.doc("mensagens/"+uid()).set({clienteId:c.id, texto:t, por:S.uid||null, em:new Date().toISOString()}); }catch(e){ S.msgDraft=t; writeErr(e); } render(); const i2=$("#msg-in"); if(i2) i2.focus(); };
  $("#msg-send").onclick=send; inp.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } };
}

/* ---------- Portal do cliente: link individual ---------- */
async function openPortal(c){
  S.modal={kind:"portal", c, acc:undefined, confirm:null, busy:false};
  const draw=()=>{ const M=S.modal; if(!M||M.kind!=="portal") return; const a=M.acc; const link=a?location.origin+"/p/"+a.token:"";
    const nIdeias=S.citems.filter(i=>i.portal).length, nArq=S.cfiles.filter(f=>f.portal).length;
    mount(`<div class="scrim"><div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="pt-t" style="width:min(620px,100%)">
      <div class="m-head"><div style="flex:1"><div class="eyebrow">Spectra</div><h2 id="pt-t" class="dot-title">Portal do cliente</h2></div><button type="button" class="icon-btn" data-close aria-label="Fechar">${icon(I.x)}</button></div>
      <div class="m-body" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;gap:14px;align-items:flex-start"><span class="shield">${icon('<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>')}</span>
          <div><b style="font-size:17px;color:var(--accent)">Um link. Só o universo de ${esc(c.nome)}.</b><p style="margin:6px 0 0;color:var(--muted)">Quem tiver o link vê os conteúdos em aprovação, ajuste ou aprovados, e as ideias e arquivos que você liberar. Pode aprovar, pedir ajuste e comentar.</p></div></div>
        <div class="note-box" style="margin:0"><b>Informações internas ficam com a Spectra.</b><br>CRM, contratos, briefing, rascunhos e mensagens internas não aparecem no portal.</div>
        <div class="chips"><span class="chip">${nIdeias} ${nIdeias===1?"ideia liberada":"ideias liberadas"}</span><span class="chip">${nArq} ${nArq===1?"arquivo liberado":"arquivos liberados"}</span></div>
        ${a===undefined?`<div class="skeleton" style="height:60px"></div>`:a&&a.ativo?`<div class="field"><label for="pt-link">Link individual do cliente</label><input class="inp" id="pt-link" readonly value="${esc(link)}"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn accent" id="pt-copy">${icon(CI.copy)}Copiar link</button><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${icon(I.ext)}Visualizar portal</a></div>`
          :`<div class="empty" style="padding:20px"><p>${a?"O acesso está desativado. O link antigo não abre mais.":"Este cliente ainda não tem link de portal."}</p><button type="button" class="btn accent" id="pt-create" ${S.dbState==="ready"?"":"disabled"}>${a?"Reativar com um link novo":"Gerar link do portal"}</button></div>`}
      </div>
      ${a&&a.ativo?`<div class="m-foot">${M.confirm?`<div class="confirm-inline"><span>${M.confirm==="novo"?"O link atual vai parar de funcionar. Gerar outro?":"Desativar o acesso deste cliente ao portal?"}</span><button type="button" class="btn small" id="pt-no">Cancelar</button><button type="button" class="btn small danger solid" id="pt-yes">${M.confirm==="novo"?"Gerar novo link":"Desativar"}</button></div>`
        :`<button type="button" class="linkish" id="pt-new">Gerar novo link</button><span class="spacer"></span><button type="button" class="linkish danger" id="pt-off">Desativar acesso</button>`}</div>`:""}
    </div></div>`);
    const q=s=>$(s);
    if(q("#pt-copy")) q("#pt-copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); toast("Link copiado."); }catch(e){ const i=q("#pt-link"); i.focus(); i.select(); toast("Selecione e copie com Ctrl+C."); } };
    const save=async row=>{ const { data, error } = await sb.from("portal_acessos").upsert({cliente_id:c.id, ...row}).select().single(); if(error) throw mapErr(error); M.acc=data; M.confirm=null; draw(); };
    if(q("#pt-create")) q("#pt-create").onclick=async()=>{ try{ await save({token:crypto.randomUUID(), ativo:true}); toast("Link do portal criado."); }catch(e){ writeErr(e); } };
    if(q("#pt-new")) q("#pt-new").onclick=()=>{ M.confirm="novo"; draw(); };
    if(q("#pt-off")) q("#pt-off").onclick=()=>{ M.confirm="off"; draw(); };
    if(q("#pt-no")) q("#pt-no").onclick=()=>{ M.confirm=null; draw(); };
    if(q("#pt-yes")) q("#pt-yes").onclick=async()=>{ try{ if(M.confirm==="novo"){ await save({token:crypto.randomUUID(), ativo:true}); toast("Novo link gerado. O anterior não abre mais."); } else { await save({ativo:false}); toast("Acesso desativado."); } }catch(e){ writeErr(e); } };
  };
  draw();
  const { data } = await sb.from("portal_acessos").select("*").eq("cliente_id", c.id).maybeSingle();
  if(S.modal&&S.modal.kind==="portal"){ S.modal.acc=data||null; draw(); }
}

/* ---------- Equipe ---------- */
function openTeam(){
  S.modal={kind:"team"};
  const draw=()=>{ if(!S.modal||S.modal.kind!=="team") return; const list=Object.values(TEAM).sort((a,b)=>(a.papel==="pendente"?0:1)-(b.papel==="pendente"?0:1)||(a.nome||"").localeCompare(b.nome||""));
    const admin=S.me.papel==="admin";
    mount(`<div class="scrim"><div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="tm-t" style="width:min(620px,100%)">
      <div class="m-head"><div style="flex:1"><h2 id="tm-t">Equipe</h2><div class="sub">Quem cria conta em ${esc(location.host)} entra como pendente até ${admin?"você aprovar":"um administrador aprovar"}.</div></div><button type="button" class="icon-btn" data-close aria-label="Fechar">${icon(I.x)}</button></div>
      <div class="m-body"><div class="hist">${list.map(p=>`<div class="hist-item" style="grid-template-columns:28px minmax(0,1fr) auto;align-items:center"><span class="av">${esc((p.nome||p.email||"?")[0].toUpperCase())}</span>
        <div><p><b>${esc(p.nome||p.email)}</b>${p.id===S.me.id?" (você)":""}</p><time>${esc(p.email)}</time></div>
        ${admin&&p.id!==S.me.id?`<div style="display:flex;gap:6px;align-items:center"><select class="select" style="height:34px" data-papel="${esc(p.id)}" aria-label="Papel de ${esc(p.nome||p.email)}">${[["pendente","Pendente"],["equipe","Equipe"],["admin","Administrador"]].map(([k,n])=>`<option value="${k}" ${p.papel===k?"selected":""}>${n}</option>`).join("")}</select><button type="button" class="icon-btn" data-rmuser="${esc(p.id)}" aria-label="Remover ${esc(p.nome||p.email)}">${icon(I.trash)}</button></div>`
          :`<span class="badge ${p.papel==="pendente"?"Pausado":""}">${p.papel==="admin"?"Administrador":p.papel==="equipe"?"Equipe":"Pendente"}</span>`}</div>`).join("")}</div></div>
      <div class="m-foot"><span class="spacer"></span><button type="button" class="btn" data-close>Fechar</button></div></div></div>`);
    $("#layer").querySelectorAll("[data-papel]").forEach(s=>s.onchange=async()=>{ const { error } = await sb.from("profiles").update({papel:s.value}).eq("id",s.dataset.papel); if(error) writeErr(mapErr(error)); else toast("Acesso atualizado."); });
    $("#layer").querySelectorAll("[data-rmuser]").forEach(b=>b.onclick=async()=>{ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.style.background="var(--danger)"; b.style.color="#fff"; toast("Clique de novo para remover o acesso."); return; }
      const { error } = await sb.from("profiles").delete().eq("id",b.dataset.rmuser); if(error) writeErr(mapErr(error)); else toast("Acesso removido."); });
  };
  S.modal.redraw=draw; draw();
}

/* ---------- Login ---------- */
function authScreen(mode, msg){
  const box=$("#auth"); box.hidden=false; $(".app").hidden=true;
  const titles={entrar:"Entrar",criar:"Criar conta",esqueci:"Recuperar senha",nova:"Nova senha",pendente:"Quase lá",confirme:"Confirme seu e-mail"};
  let form="";
  if(mode==="entrar") form=`<div class="field"><label for="a-email">E-mail</label><input class="inp" id="a-email" type="email" autocomplete="email"></div>
    <div class="field"><label for="a-pass">Senha</label><input class="inp" id="a-pass" type="password" autocomplete="current-password"></div>
    <button type="submit" class="btn accent" style="width:100%">Entrar</button>
    <div class="auth-links"><button type="button" class="linkish" data-mode="esqueci">Esqueci minha senha</button><button type="button" class="linkish" data-mode="criar">Criar conta</button></div>`;
  else if(mode==="criar") form=`<div class="field"><label for="a-nome">Nome</label><input class="inp" id="a-nome" autocomplete="name"></div>
    <div class="field"><label for="a-email">E-mail</label><input class="inp" id="a-email" type="email" autocomplete="email"></div>
    <div class="field"><label for="a-pass">Senha</label><input class="inp" id="a-pass" type="password" autocomplete="new-password" minlength="8"><span class="hint">Pelo menos 8 caracteres.</span></div>
    <button type="submit" class="btn accent" style="width:100%">Criar conta</button>
    <div class="auth-links"><button type="button" class="linkish" data-mode="entrar">Já tenho conta</button></div>`;
  else if(mode==="esqueci") form=`<div class="field"><label for="a-email">E-mail da sua conta</label><input class="inp" id="a-email" type="email" autocomplete="email"></div>
    <button type="submit" class="btn accent" style="width:100%">Enviar link de recuperação</button>
    <div class="auth-links"><button type="button" class="linkish" data-mode="entrar">Voltar</button></div>`;
  else if(mode==="nova") form=`<div class="field"><label for="a-pass">Nova senha</label><input class="inp" id="a-pass" type="password" autocomplete="new-password" minlength="8"></div>
    <button type="submit" class="btn accent" style="width:100%">Salvar nova senha</button>`;
  else form=`<button type="button" class="btn" style="width:100%" id="a-out">Sair</button>`;
  box.innerHTML=`<div class="auth-card"><div class="auth-brand"><span class="mark">${LOGO_SVG}</span><div><div class="wm">SPECTRA<sup>®</sup></div><div class="wm-sub">WORKSPACE</div></div></div>
    <div class="prism" style="margin:18px 0 22px"></div><h1 class="dot-title" style="font-size:28px">${titles[mode]}</h1>
    ${msg?`<p class="auth-msg">${esc(msg)}</p>`:""}
    <form id="a-form" novalidate style="display:flex;flex-direction:column;gap:14px;margin-top:16px">${form}</form>
    <p class="auth-slogan">Stay inspired, never stop creating.</p></div>`;
  box.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>authScreen(b.dataset.mode));
  const out=$("#a-out"); if(out) out.onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  const f=$("#a-form"); f.onsubmit=async e=>{ e.preventDefault(); const btn=f.querySelector("button[type=submit]"); if(btn) btn.disabled=true;
    const v=id=>{ const el=$("#"+id); return el?el.value.trim():""; };
    try{
      if(mode==="entrar"){ const { error } = await sb.auth.signInWithPassword({email:v("a-email"), password:$("#a-pass").value}); if(error) throw error; }
      else if(mode==="criar"){ if($("#a-pass").value.length<8) throw {message:"A senha precisa de pelo menos 8 caracteres."};
        const { data, error } = await sb.auth.signUp({email:v("a-email"), password:$("#a-pass").value, options:{data:{nome:v("a-nome")}, emailRedirectTo:location.origin}}); if(error) throw error;
        if(!data.session) authScreen("confirme","Enviamos um link para "+v("a-email")+". Abra o e-mail e clique no link para ativar a conta."); }
      else if(mode==="esqueci"){ const { error } = await sb.auth.resetPasswordForEmail(v("a-email"),{redirectTo:location.origin}); if(error) throw error; authScreen("entrar","Se o e-mail tiver conta, chega um link para criar uma nova senha."); }
      else if(mode==="nova"){ const { error } = await sb.auth.updateUser({password:$("#a-pass").value}); if(error) throw error; location.hash=""; location.reload(); }
    }catch(err){ const m=(err&&err.message)||""; authScreen(mode, /Invalid login/i.test(m)?"E-mail ou senha incorretos.":/Email not confirmed/i.test(m)?"Confirme seu e-mail pelo link que enviamos antes de entrar.":/already registered/i.test(m)?"Este e-mail já tem conta. Use Entrar.":m||"Não foi possível concluir. Tente de novo."); }
  };
  const first=box.querySelector("input"); if(first) first.focus();
}

async function startApp(session){
  if(S.started) return;
  const { data: me, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if(error||!me){ authScreen("entrar","Não encontramos seu perfil. Saia e entre de novo."); return; }
  if(me.papel==="pendente"){ authScreen("pendente","Sua conta foi criada. Um administrador da Spectra precisa liberar seu acesso. Avise o Pedro e recarregue a página depois."); return; }
  S.started=true; S.me=me; S.uid=me.id; S.db=DB; S.user=USER; S.assets=ASSETS; S.sample=SAMPLE;
  $("#auth").hidden=true; $(".app").hidden=false;
  readRoute(); applyBrand(); renderNav(); renderMe(); render(); connect();
}

async function boot(){
  S.recovering = location.hash.includes("type=recovery");
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==="PASSWORD_RECOVERY"){ authScreen("nova","Escolha uma nova senha para sua conta."); return; }
    if(ev==="SIGNED_IN" && session && !S.started && !S.recovering) setTimeout(()=>startApp(session),0);
    if(ev==="SIGNED_OUT"){ location.hash=""; location.reload(); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if(S.recovering) return;
  if(session) startApp(session); else authScreen("entrar");
}

/* ================= Dados ================= */
async function connect(){
  const db=S.db;
  const slow=setTimeout(()=>{ if(S.dbState==="loading"){ S.dbState="slow"; render(); } },10000);
  const onErr = e => { clearTimeout(slow); };
  liveSub("profiles", null, async()=>{ const { data, error } = await sb.from("profiles").select("*"); if(error) throw mapErr(error); return data||[]; }, rows=>{
    Object.keys(TEAM).forEach(k=>delete TEAM[k]); rows.forEach(r=>TEAM[r.id]=r);
    const me=TEAM[S.me.id]; if(!me||me.papel==="pendente"){ sb.auth.signOut(); return; } S.me=me;
    const n=rows.filter(r=>r.papel==="pendente").length; const b=$("#pend-n"); if(b){ b.hidden=!(n&&me.papel==="admin"); b.textContent=n; }
    if(S.modal&&S.modal.kind==="team"&&S.modal.redraw) S.modal.redraw(); renderMe(); render(); }, ()=>{});
  db.collection("oportunidades").onSnapshot(snap=>{
    S.opps=snap.docs.map(d=>({id:d.id,...d.data()}));
    clearTimeout(slow); S.dbState="ready";
    render();
    if(S.modal&&S.modal.kind==="opp"&&S.modal.id&&!S.opps.some(o=>o.id===S.modal.id)&&!S.modal.confirmDel){ closeModal(); toast("Esta oportunidade foi excluída por outra pessoa."); }
  }, e=>{ onErr(e); S.dbState="none"; render(); });
  db.collection("clientes").onSnapshot(s=>{ S.clientes=s.docs.map(d=>({id:d.id,...d.data()})); if(S.route==="clientes") render(); }, onErr);
  db.collection("posts").where("mes","==",ymOf(new Date())).onSnapshot(s=>{ S.monthPosts=s.docs.map(d=>({id:d.id,...d.data()})); if(S.route==="clientes"&&!S.clientId) render(); }, onErr);
  db.doc("config/funil").onSnapshot(s=>{ const et=s.exists&&s.data().etapas; S.stages = Array.isArray(et)&&et.length ? et : DEFAULT_STAGES; render(); }, onErr);
  db.doc("config/marca").onSnapshot(s=>{ S.marca = s.exists ? s.data() : {}; applyBrand(); }, onErr);
  db.collection("atividades").orderBy("em","desc").limit(150).onSnapshot(async snap=>{
    S.acts=snap.docs.map(d=>d.data());
    if(S.modal&&S.modal.kind==="hist"){ S.modal.redraw&&S.modal.redraw(); }
  }, onErr);
}

/* ================= Início ================= */
$("#btn-team").onclick=openTeam;
$("#btn-out").onclick=async()=>{ await sb.auth.signOut(); };
boot();
})();
</script>
